services:
  postgres:
    image: postgres:17.5
    container_name: sinapipro-postgres
    environment:
      POSTGRES_DB: sinapipro
      POSTGRES_USER: sinapipro
      POSTGRES_PASSWORD: sinapipro
    ports:
      - "5499:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sinapipro-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/sinapipro
      DB_USERNAME: sinapipro
      DB_PASSWORD: sinapipro
      JWT_SECRET: showcase-dev-key-not-for-production-min-48-chars!!
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      OTEL_ENDPOINT: http://otel-lgtm:4318/v1/traces
      OTEL_SAMPLING: "1.0"
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
    ports:
      - "8180:8080"
      - "8181:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sinapipro-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9190:9090"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: sinapipro-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo-dashboard.json
    ports:
      - "3200:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:0.11.8
    container_name: sinapipro-otel
    ports:
      - "4417:4317"
      - "4418:4318"
      - "3101:3100"
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: sinapipro-mailhog
    ports:
      - "1125:1025"
      - "8125:8025"
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
