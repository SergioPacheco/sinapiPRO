spring:
  application:
    name: sinapipro-api
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sinapipro}
    username: ${DB_USERNAME:sinapipro}
    password: ${DB_PASSWORD:sinapipro}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      pool-name: showcase-pool
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 64
        format_sql: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  shutdown: graceful
  tomcat:
    connection-timeout: 30s

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,configprops
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  level:
    com.sinapipro: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
  writer-with-default-pretty-printer: true

sinapipro:
  security:
    issuer: sinapipro
    secret: ${JWT_SECRET:dev-only-unsafe-key-replace-in-production-min-48-chars!!}
    demo-user:
      username: ${DEMO_USER:admin@sinapipro.dev}
      password: ${DEMO_PASSWORD:SinapiPro#2026}
      roles:
        - ADMIN
        - USER
    access-token:
      ttl: PT8H
      scope: sinapipro.read sinapipro.write
    refresh-token:
      ttl: P14D

info:
  app:
    name: SinapiPRO Showcase API
    java: 25
    spring-boot: 4.0.5
    style: api-first

spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: ${MAIL_AUTH:false}
    mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

# Resilience4j — Circuit Breaker + Retry para integrações externas
resilience4j:
  circuitbreaker:
    instances:
      emailService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      emailService:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.mail.MailException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
