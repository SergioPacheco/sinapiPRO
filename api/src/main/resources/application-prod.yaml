# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  docker:
    compose:
      enabled: false
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:}

sinapipro:
  security:
    secret: ${JWT_SECRET}  # No default — MUST be set via env var in prod
    cors:
      allowed-origins: ${CORS_ORIGINS:https://app.sinapipro.dev}

server:
  tomcat:
    connection-timeout: 20s

logging:
  structured:
    format:
      console: ecs
  level:
    com.sinapipro: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

management:
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING:0.1}
