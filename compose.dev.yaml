services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: sinapipro
      POSTGRES_USER: sinapipro
      POSTGRES_PASSWORD: sinapipro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinapipro"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sinapipro
      SPRING_DATASOURCE_USERNAME: sinapipro
      SPRING_DATASOURCE_PASSWORD: sinapipro
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./docs/reference/sinapi:/app/sinapi:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
