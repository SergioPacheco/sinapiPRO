server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ─── API Proxy ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket Proxy ──────────────────────────────────────
    location /ws {
        proxy_pass http://api:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── JS/CSS com content hash (imutáveis — cache 1 ano) ───
    # Angular CLI gera nomes como main-ABCDEF12.js (hash de 8+ chars)
    location ~* "\.[0-9a-f]{8,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Fontes e Imagens (cache 6 meses) ────────────────────
    location ~* \.(woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|webp|avif|svg)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─── index.html — NUNCA cachear (entry point da SPA) ─────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ─── SPA fallback ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
