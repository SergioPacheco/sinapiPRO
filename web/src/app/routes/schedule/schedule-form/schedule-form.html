<page-header title="Nova Atividade" />
<mat-card><mat-card-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Início planejado</mat-label>
      <input matInput formControlName="plannedStart" type="date" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fim planejado</mat-label>
      <input matInput formControlName="plannedEnd" type="date" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Duração (dias)</mat-label>
      <input matInput [value]="duration" disabled />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Peso (%)</mat-label>
      <input matInput formControlName="weightPct" type="number" min="0.01" max="100" step="0.01" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Ordem</mat-label>
      <input matInput formControlName="sortOrder" type="number" min="1" />
    </mat-form-field>
    <div class="form-actions">
      <button mat-button type="button" (click)="cancel()">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Salvar</button>
    </div>
  </form>
</mat-card-content></mat-card>
