<page-header title="Nova Ocorrência de Segurança" />
<mat-card><mat-card-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Data</mat-label>
      <input matInput formControlName="date" type="date" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Severidade</mat-label>
      <mat-select formControlName="severity">
        <mat-option value="LOW">Baixa</mat-option>
        <mat-option value="MEDIUM">Média</mat-option>
        <mat-option value="HIGH">Alta</mat-option>
        <mat-option value="CRITICAL">Crítica</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>ID do Orçamento</mat-label>
      <input matInput formControlName="budgetId" />
    </mat-form-field>
    <div class="form-actions">
      <button mat-button type="button" (click)="router.navigate(['/safety'])">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Salvar</button>
    </div>
  </form>
</mat-card-content></mat-card>
