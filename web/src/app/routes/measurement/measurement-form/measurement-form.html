<page-header title="Nova Medição" />
<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>ID do Orçamento</mat-label>
        <input matInput formControlName="budgetId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Número da Medição</mat-label>
        <input matInput formControlName="number" type="number" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Período Início</mat-label>
        <input matInput formControlName="periodStart" type="date" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Período Fim</mat-label>
        <input matInput formControlName="periodEnd" type="date" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Retenção (%)</mat-label>
        <input matInput formControlName="retentionPct" type="number" step="0.01" />
      </mat-form-field>
      <div class="form-actions">
        <button mat-button type="button" (click)="router.navigate(['/measurements'])">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Criar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
