<page-header title="Novo Registro — Diário de Obra" />
<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Data</mat-label>
        <input matInput formControlName="date" type="date" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Clima</mat-label>
        <mat-select formControlName="weather">
          @for (w of weathers; track w) {
            <mat-option [value]="w">{{ w }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Temperatura (°C)</mat-label>
        <input matInput formControlName="temperature" type="number" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Mão de Obra (pessoas)</mat-label>
        <input matInput formControlName="laborCount" type="number" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Equipamentos</mat-label>
        <input matInput formControlName="equipmentCount" type="number" />
      </mat-form-field>
      <mat-form-field appearance="outline" style="grid-column: 1 / -1;">
        <mat-label>Observações</mat-label>
        <textarea matInput formControlName="notes" rows="3"></textarea>
      </mat-form-field>

      <!-- Atrasos Climáticos -->
      <div class="weather-delay-section" style="grid-column: 1 / -1;">
        <h4>Atraso Climático</h4>
        <div class="form-grid">
          <mat-form-field appearance="outline">
            <mat-label>Horas Perdidas</mat-label>
            <input matInput formControlName="weatherHoursLost" type="number" min="0" step="0.5" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Condição</mat-label>
            <mat-select formControlName="weatherCondition">
              <mat-option value="">Sem atraso</mat-option>
              <mat-option value="Chuva forte">Chuva forte</mat-option>
              <mat-option value="Temporal com ventos">Temporal com ventos</mat-option>
              <mat-option value="Alagamento">Alagamento</mat-option>
              <mat-option value="Granizo">Granizo</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="outline" style="grid-column: 1 / -1;">
            <mat-label>Impacto na obra</mat-label>
            <input matInput formControlName="weatherImpact" placeholder="Descreva o impacto..." />
          </mat-form-field>
        </div>
      </div>

      <div class="form-actions">
        <button mat-button type="button" (click)="router.navigate(['/daily-log'])">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Registrar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
