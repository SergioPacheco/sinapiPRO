<page-header title="Insumos" subtitle="Catálogo de materiais, mão de obra e equipamentos" />

<div class="filter-bar">
  <mat-form-field appearance="outline" class="filter-search">
    <mat-label>Buscar</mat-label>
    <input matInput [(ngModel)]="filters.q" (keyup.enter)="applyFilters()" placeholder="Código ou descrição" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-select">
    <mat-label>Origem</mat-label>
    <mat-select [(ngModel)]="filters.origin" (selectionChange)="applyFilters()">
      <mat-option [value]="undefined">Todas</mat-option>
      @for (o of filterOptions.origins; track o) {
        <mat-option [value]="o">{{ o }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-select">
    <mat-label>Unidade</mat-label>
    <mat-select [(ngModel)]="filters.unit" (selectionChange)="applyFilters()">
      <mat-option [value]="undefined">Todas</mat-option>
      @for (u of filterOptions.units; track u) {
        <mat-option [value]="u">{{ u }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-select">
    <mat-label>Estado (preço)</mat-label>
    <mat-select [(ngModel)]="filters.state" (selectionChange)="applyFilters()">
      <mat-option [value]="undefined">—</mat-option>
      <mat-option value="AC">AC</mat-option><mat-option value="AL">AL</mat-option>
      <mat-option value="AM">AM</mat-option><mat-option value="AP">AP</mat-option>
      <mat-option value="BA">BA</mat-option><mat-option value="CE">CE</mat-option>
      <mat-option value="DF">DF</mat-option><mat-option value="ES">ES</mat-option>
      <mat-option value="GO">GO</mat-option><mat-option value="MA">MA</mat-option>
      <mat-option value="MG">MG</mat-option><mat-option value="MS">MS</mat-option>
      <mat-option value="MT">MT</mat-option><mat-option value="PA">PA</mat-option>
      <mat-option value="PB">PB</mat-option><mat-option value="PE">PE</mat-option>
      <mat-option value="PI">PI</mat-option><mat-option value="PR">PR</mat-option>
      <mat-option value="RJ">RJ</mat-option><mat-option value="RN">RN</mat-option>
      <mat-option value="RO">RO</mat-option><mat-option value="RR">RR</mat-option>
      <mat-option value="RS">RS</mat-option><mat-option value="SC">SC</mat-option>
      <mat-option value="SE">SE</mat-option><mat-option value="SP">SP</mat-option>
      <mat-option value="TO">TO</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-month">
    <mat-label>Mês Ref.</mat-label>
    <input matInput type="month" [(ngModel)]="filters.referenceMonth" (change)="applyFilters()" />
  </mat-form-field>

  <button mat-icon-button (click)="applyFilters()" color="primary"><mat-icon>filter_list</mat-icon></button>
  @if (activeFilterCount > 0) {
    <button mat-button (click)="clearFilters()"><mat-icon>clear</mat-icon> Limpar ({{ activeFilterCount }})</button>
  }

  <span class="spacer"></span>
  <button mat-flat-button color="accent" (click)="create()"><mat-icon>add</mat-icon> Novo Insumo</button>
</div>

<mtx-grid
  [columns]="columns"
  [data]="list"
  [length]="total"
  [loading]="isLoading"
  [pageOnFront]="false"
  [pageIndex]="query.page"
  [pageSize]="query.size"
  [pageSizeOptions]="[10, 20, 50]"
  [sortOnFront]="false"
  [showToolbar]="true"
  [columnResizable]="true"
  [rowSelectable]="false"
  (page)="onPageChange($event)"
  (rowClick)="onRowClick($event)"
/>
