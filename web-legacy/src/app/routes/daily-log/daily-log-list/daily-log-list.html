<page-header title="Diário de Obra" subtitle="Registro diário de atividades" />

@if (weatherSummary) {
  <mat-card class="m-b-16" style="border-left: 4px solid #1565c0;">
    <mat-card-content class="d-flex gap-16 flex-wrap">
      <span><strong>Atrasos climáticos:</strong> {{ weatherSummary.totalDelays }}</span>
      <span><strong>Dias perdidos:</strong> {{ weatherSummary.fullDaysLost }}</span>
      <span><strong>Horas perdidas:</strong> {{ weatherSummary.totalHoursLost }}</span>
    </mat-card-content>
  </mat-card>
}

<mtx-grid
  [columns]="columns"
  [data]="list"
  [length]="total"
  [loading]="isLoading"
  [pageOnFront]="false"
  [pageIndex]="query.page"
  [pageSize]="query.size"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
/>
