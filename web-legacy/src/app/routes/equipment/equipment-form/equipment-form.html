<page-header [title]="isEdit ? 'Editar Equipamento' : 'Novo Equipamento'" />
<mat-card><mat-card-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input matInput formControlName="code" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="type">
        <mat-option value="OWNED">Próprio</mat-option>
        <mat-option value="RENTED">Alugado</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="AVAILABLE">Disponível</mat-option>
        <mat-option value="IN_USE">Em Uso</mat-option>
        <mat-option value="MAINTENANCE">Manutenção</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Custo/Hora (R$)</mat-label>
      <input matInput formControlName="hourlyRate" type="number" step="0.01" />
    </mat-form-field>
    <div class="form-actions">
      <button mat-button type="button" (click)="router.navigate(['/equipment'])">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Salvar</button>
    </div>
  </form>
</mat-card-content></mat-card>
