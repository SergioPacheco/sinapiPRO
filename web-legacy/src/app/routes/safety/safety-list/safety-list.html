<page-header title="Segurança do Trabalho" subtitle="Incidentes e inspeções">
  <button mat-stroked-button (click)="downloadReport()">
    <mat-icon>picture_as_pdf</mat-icon> Relatório de Segurança
  </button>
</page-header>

<mtx-grid
  [columns]="columns"
  [data]="list"
  [length]="total"
  [loading]="isLoading"
  [pageOnFront]="false"
  [pageIndex]="query.page"
  [pageSize]="query.size"
  [pageSizeOptions]="[10, 20, 50]"
  (page)="onPageChange($event)"
/>
