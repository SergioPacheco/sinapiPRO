<page-header [title]="isEdit ? 'Editar Contrato' : 'Novo Contrato'" />
<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Número</mat-label>
        <input matInput formControlName="number" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>

      <app-lookup-field
        label="Fornecedor"
        [displayValue]="supplierDisplay"
        [allowCreate]="true"
        (onSearch)="searchSupplier()"
        (onCreate)="createSupplier()"
        (onClear)="clearSupplier()"
      />

      <mat-form-field appearance="outline">
        <mat-label>Valor Original (R$)</mat-label>
        <input matInput formControlName="originalValue" type="number" step="0.01" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Retenção (%)</mat-label>
        <input matInput formControlName="retentionPct" type="number" step="0.01" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="DRAFT">Rascunho</mat-option>
          <mat-option value="ACTIVE">Ativo</mat-option>
          <mat-option value="COMPLETED">Concluído</mat-option>
          <mat-option value="CANCELLED">Cancelado</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Data Início</mat-label>
        <input matInput formControlName="startDate" type="date" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Data Fim</mat-label>
        <input matInput formControlName="endDate" type="date" />
      </mat-form-field>
      <div class="form-actions">
        <button mat-button type="button" (click)="router.navigate(['/contracts'])">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
          {{ isEdit ? 'Atualizar' : 'Criar' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<!-- Quick Create Supplier Template -->
<ng-template #supplierFormTpl>
  <div class="quick-form">
    <mat-form-field appearance="outline"><mat-label>Nome / Razão Social</mat-label><input matInput [(ngModel)]="newSupplier.name" required /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>CNPJ</mat-label><input matInput [(ngModel)]="newSupplier.taxId" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput [(ngModel)]="newSupplier.email" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Telefone</mat-label><input matInput [(ngModel)]="newSupplier.phone" /></mat-form-field>
  </div>
</ng-template>
