apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sinapipro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sinapipro
            - name: POSTGRES_USER
              value: sinapipro
            - name: POSTGRES_PASSWORD
              value: changeme
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sinapipro
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
