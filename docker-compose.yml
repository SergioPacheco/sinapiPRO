# =============================================================
# SinapiPRO — Full Stack (portas 4xxx para não conflitar)
# =============================================================
# Portas expostas:
#   4200 — Frontend (Angular/Nginx)
#   4080 — API (Spring Boot)
#   4081 — API Actuator/Management
#   4432 — PostgreSQL
#   4090 — Prometheus
#   4030 — Grafana (admin/admin)
#   4317 — OpenTelemetry gRPC
#   4318 — OpenTelemetry HTTP
# =============================================================

services:
  postgres:
    image: postgres:17.5
    container_name: sinapipro-db
    environment:
      POSTGRES_DB: sinapipro
      POSTGRES_USER: sinapipro
      POSTGRES_PASSWORD: sinapipro
    ports:
      - "4432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinapipro -d sinapipro"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sinapipro-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sinapipro
      SPRING_DATASOURCE_USERNAME: sinapipro
      SPRING_DATASOURCE_PASSWORD: sinapipro
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_FLYWAY_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel:4318/v1/traces
      MANAGEMENT_SERVER_PORT: "8081"
    ports:
      - "4080:8080"
      - "4081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sinapipro-web
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sinapipro-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./api/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "4090:9090"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: sinapipro-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "4030:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  otel:
    image: grafana/otel-lgtm:0.11.8
    container_name: sinapipro-otel
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
