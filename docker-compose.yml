version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: sinapipro-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sinapipro
      MYSQL_USER: sinapipro
      MYSQL_PASSWORD: sinapipro123
    ports:
      - "3306:3306"
    volumes:
      - sinapipro-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sinapipro-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sinapipro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: sinapipro
      SPRING_DATASOURCE_PASSWORD: sinapipro123
    ports:
      - "8090:8090"
    volumes:
      - sinapipro-ged:/app/ged

volumes:
  sinapipro-data:
  sinapipro-ged:
