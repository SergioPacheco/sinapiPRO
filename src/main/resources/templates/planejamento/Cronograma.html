<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cronograma Financeiro + Curva S</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-8"><h1>Cronograma Financeiro</h1></div>
				<div class="col-sm-4 text-right" style="margin-top:20px;">
					<a class="btn btn-default" th:href="@{/planejamento/{id}(id=${orcamento.codigo})}">
						<i class="glyphicon glyphicon-arrow-left"></i> Voltar
					</a>
					<a class="btn btn-primary" th:href="@{/relatorios/cronograma/{id}(id=${orcamento.codigo})}">
						<i class="glyphicon glyphicon-print"></i> PDF
					</a>
				</div>
			</div>
		</div>
	</div>
	<div class="container-fluid">
		<h3 th:text="${orcamento.nome}">Orçamento</h3>
		<div th:if="${cronograma.isEmpty()}" class="alert alert-warning">
			Nenhum item planejado. <a th:href="@{/planejamento/{id}(id=${orcamento.codigo})}">Defina as datas primeiro</a>.
		</div>
		<div th:unless="${cronograma.isEmpty()}">
			<div class="table-responsive">
				<table class="table table-bordered table-condensed">
					<thead>
						<tr class="active">
							<th>Período</th>
							<th class="text-right">Valor Planejado</th>
							<th class="text-right">Valor Acumulado</th>
							<th class="text-right">% Acumulado</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="cm : ${cronograma}">
							<td th:text="${cm.periodo}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(cm.valorPlanejado, 1, 2)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(cm.valorAcumulado, 1, 2)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(cm.percentual, 1, 2) + '%'}"></td>
						</tr>
					</tbody>
				</table>
			</div>
			<h3>Curva S</h3>
			<div class="progress" style="height:30px;">
				<div th:each="cm : ${cronograma}" class="progress-bar" role="progressbar"
					 th:style="|width:${cm.percentual.subtract(cm == cronograma[0] ? 0 : cronograma[__${cmStat.index - 1}__].percentual)}%|"
					 th:title="${cm.periodo + ': ' + #numbers.formatDecimal(cm.percentual, 1, 2) + '%'}">
				</div>
			</div>
			<table class="table table-condensed" style="margin-top:10px;">
				<tr th:each="cm : ${cronograma}">
					<td th:text="${cm.periodo}" style="width:100px;"></td>
					<td>
						<div class="progress" style="margin:0;height:20px;">
							<div class="progress-bar progress-bar-info" role="progressbar"
								 th:style="|width:${cm.percentual}%|"
								 th:text="${#numbers.formatDecimal(cm.percentual, 1, 1) + '%'}">
							</div>
						</div>
					</td>
				</tr>
			</table>
		</div>
	</div>
</section>
</body>
</html>
