<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Tabela de Preços</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10"><h1 th:if="${tabelaPreco.novo}">Nova Tabela de Preços</h1><h1 th:unless="${tabelaPreco.novo}" th:text="|Tabela: ${tabelaPreco.nome}|">Tabela</h1></div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/tabelasPrecos}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${tabelaPreco}"
      th:action="${tabelaPreco.novo} ? @{/tabelasPrecos/novo} : @{/tabelasPrecos/{c}(c=${tabelaPreco.codigo})}">
    <sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-5 sn-required"><label class="control-label">Nome</label><input type="text" class="form-control" th:field="*{nome}"/></div>
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="obra">
            <label class="control-label">Obra</label>
            <select class="form-control" th:field="*{obra}">
                <option value="">Selecione...</option>
                <option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-2"><label class="control-label">Vigência</label><input type="date" class="form-control" th:field="*{dataVigencia}"/></div>
        <div class="form-group col-sm-1"><label class="checkbox-inline" style="margin-top:30px;"><input type="checkbox" th:field="*{ativa}"/> Ativa</label></div>
    </div>
    <h3>Preços por Unidade</h3>
    <table class="table table-bordered table-condensed" id="tblItens">
        <thead><tr><th>Unidade</th><th>Valor</th><th></th></tr></thead>
        <tbody>
            <tr th:each="item, stat : *{itens}">
                <input type="hidden" th:field="*{itens[__${stat.index}__].codigo}"/>
                <td>
                    <select class="form-control input-sm" th:field="*{itens[__${stat.index}__].unidade}">
                        <option th:each="u : ${unidades}" th:value="${u.codigo}" th:text="${u.identificacao}"></option>
                    </select>
                </td>
                <td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].valor}" style="width:120px;"/></td>
                <td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
            </tr>
        </tbody>
    </table>
    <button type="button" class="btn btn-xs btn-default" onclick="addItem()">+ Unidade</button>
    <div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idx = document.getElementById('tblItens').querySelector('tbody').rows.length;
function addItem() {
    var tbody = document.getElementById('tblItens').querySelector('tbody');
    var row = tbody.insertRow();
    row.innerHTML = '<td><select class="form-control input-sm" name="itens['+idx+'].unidade"><option value="">Selecione...</option></select></td>' +
        '<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idx+'].valor" value="0" style="width:120px;"/></td>' +
        '<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>';
    idx++;
}
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
