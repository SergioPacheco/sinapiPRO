<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Prestação de Contas</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10"><h1 th:if="${prestacaoContas.novo}">Novo Lançamento</h1><h1 th:unless="${prestacaoContas.novo}" th:text="|Edição: ${prestacaoContas.descricao}|">Lançamento</h1></div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/prestacaoContas}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${prestacaoContas}"
      th:action="${prestacaoContas.novo} ? @{/prestacaoContas/novo} : @{/prestacaoContas/{c}(c=${prestacaoContas.codigo})}">
    <sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="funcionario">
            <label class="control-label">Funcionário</label>
            <select class="form-control" th:field="*{funcionario}">
                <option value="">Selecione...</option>
                <option th:each="f : ${funcionarios}" th:value="${f.codigo}" th:text="${f.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-3 sn-required" sinapiPRO:classforerror="competencia">
            <label class="control-label">Competência</label>
            <select class="form-control" th:field="*{competencia}">
                <option value="">Selecione...</option>
                <option th:each="c : ${competencias}" th:value="${c.codigo}" th:text="${c.label}"></option>
            </select>
        </div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Data</label><input type="date" class="form-control" th:field="*{dataLancamento}"/></div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Valor</label><input type="number" step="0.01" class="form-control" th:field="*{valor}"/></div>
    </div>
    <div class="row">
        <div class="form-group col-sm-6 sn-required"><label class="control-label">Descrição</label><input type="text" class="form-control" th:field="*{descricao}"/></div>
        <div class="form-group col-sm-2">
            <label class="control-label">Tipo</label>
            <select class="form-control" th:field="*{tipo}">
                <option value="DESPESA">Despesa</option><option value="RECEITA">Receita</option>
            </select>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="PENDENTE">Pendente</option><option value="APROVADO">Aprovado</option><option value="REJEITADO">Rejeitado</option>
            </select>
        </div>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
