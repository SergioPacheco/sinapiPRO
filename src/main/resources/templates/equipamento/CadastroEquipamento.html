<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Equipamento</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${equipamento.novo}">Cadastro de Equipamento</h1><h1 th:unless="${equipamento.novo}" th:text="|Edição de ${equipamento.nome}|">Edição</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/equipamentos}"><i class="glyphicon glyphicon-search"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${equipamento}" th:action="${equipamento.novo} ? @{/equipamentos/novo} : @{/equipamentos/{c}(c=${equipamento.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-6 sn-required" sinapiPRO:classforerror="nome"><label class="control-label">Nome</label><input type="text" class="form-control" th:field="*{nome}"/></div>
		<div class="form-group col-sm-3"><label class="control-label">Tipo</label><input type="text" class="form-control" th:field="*{tipo}"/></div>
		<div class="form-group col-sm-3"><label class="control-label">Nº Série</label><input type="text" class="form-control" th:field="*{numeroSerie}"/></div>
	</div>
	<div class="form-group"><label class="control-label">Descrição</label><input type="text" class="form-control" th:field="*{descricao}"/></div>
	<div class="form-group"><label class="checkbox-inline"><input type="checkbox" th:field="*{ativo}"/> Ativo</label></div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form></div>
</section></body></html>
