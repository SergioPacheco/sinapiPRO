<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
	
<div class="modal  fade" id="pesquisaRapidaObras" tabindex="-1" role="dialog" th:fragment="pesquisaRapidaObras">
 	<div class="modal-dialog">
   		<div class="modal-content">
   			<div class="modal-header">
       			<button type="button" class="close" data-dismiss="modal"><i>&times;</i></button>
        		<h4 class="modal-title">Pesquisa de Obras</h4>
      		</div>
      		
   			<div class="modal-body">
   				<div class="alert  alert-danger  alert-dismissible  hidden  js-mensagem-erro" role="alert">
					<button type="button" class="close" data-dismiss="alert" ><span aria-hidden="true">&times;</span></button>
					<div><i class="fa  fa-exclamation-circle"></i>Informe pelo menos 3 letras na pesquisa</div>
				</div>
   			
   				<form class="form" th:action="@{/obras}">
		        	<div class="form-group">
		            	<label class="control-label" for="nomeObraModal">Nome</label>
	                	<input id="nomeObraModal" type="text" class="form-control" autofocus="autofocus"/>
		            </div>
		            
		            <button type="submit" class="btn  btn-primary  js-pesquisa-rapida-obras-btn">Pesquisar</button>
		            <a href="#" class="btn  btn-default" data-dismiss="modal">Cancelar</a>	
		        </form>
		        
		        <div id="containerTabelaPesquisaRapidaObras">
		        </div>
		        
     		</div>
   		</div>
 	</div>
 	
 	<script id="tabela-pesquisa-rapida-obra" type="text/x-handlebars-template">
<div class="table-responsive  sn-tabela-simples" style="margin-top: 15px">
	<table class="table  table-hover">
		<thead>
			<tr>
				<th class="col-sm-2">Nome</th>
				<th class="col-sm-2">CEI</th>
			</tr>
		</thead>
				
		<tbody>
			{{#if .}}
				{{#each .}}
					<tr data-codigo="{{codigo}}" data-nome="{{nome}}"  data-cei="{{cei}}" class="js-obra-pesquisa-rapida">
						<td>{{nome}}</td>
						<td>{{cei}}</td>
 					</tr>
				{{/each}}
			{{else}}
				<tr>
					<td colspan="2">Nenhuma obra encontrada</td>
				</tr>
			{{/if}}
		</tbody>
	</table>
</div>
</script>

</div>
	
</html>
