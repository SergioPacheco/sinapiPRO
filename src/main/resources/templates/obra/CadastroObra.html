<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:data="http://www.thymeleaf.org/extras/data"
	  xmlns:sinapiPRO="http://sinapiPRO.ifrn.edu.br"
	  layout:decorate="~{layout/LayoutPadrao}">

<head>
	<title>Cadastro de Obras</title>
</head>

<section layout:fragment="conteudo">

	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-10">
					<h1 th:if="${obra.nova}">Cadastro de Obras</h1>
					<h1 th:unless="${obra.nova}" th:text="|Edição da Obra: ${obra.nome}|">Edição de Obra</h1>
				</div>
			
				<div class="col-sm-2">
					<div class="aw-page-header-controls">
						<a class="btn  btn-default" th:href="@{/obras}">
							<i class="glyphicon  glyphicon-search"></i> 
							<span class="hidden-xs  hidden-sm">Pesquisa</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="container-fluid">
	
	<!-- 	<form method="POST" th:object="${obra}" 
		    th:action="${obra.nova} ? @{/obras/nova} : @{/obras/{codigo}(codigo=${obra.codigo})}">
		     -->
		<form method="POST" 
		      th:object="${obra}" 
		      class="form-vertical  js-form-loading"
		      th:action="@{/obras/nova}">
			 
			    
			<sinapiPRO:message/>

			<input type="hidden" th:field="*{codigo}"/>
			
			<div class="row">
				<div class="form-group  col-sm-8  sn-required" sinapiPRO:classforerror="nome">
					<label for="nome" class="control-label">Nome</label>
					<input type="text" class="form-control" id="nome" autofocus="autofocus" th:field="*{nome}"/>
				</div>
				<div class="form-group  col-sm-2  sn-required" sinapiPRO:classforerror="cei">
					<label for="cei" class="control-label">CEI</label>
					<input type="text" class="form-control" id="cei" th:field="*{cei}"/>
				</div>
				<div class="form-group  col-sm-2  sn-required" sinapiPRO:classforerror="area">
					<label for="area" class="control-label">Área</label>
					<input type="text" class="form-control" id="area" th:field="*{area}"/>
				</div>
				
			</div>
			
			<div class="row">
				<div class="form-group  col-sm-4">
					<label for="logradouro">Logradouro</label>
					<input type="text" class="form-control" id="logradouro" th:field="*{endereco.logradouro}"/>
				</div>
				
				<div class="form-group  col-sm-4">
					<label for="numero">Número</label>
					<input type="text" class="form-control" id="numero" th:field="*{endereco.numero}"/>
				</div>
				
				<div class="form-group  col-sm-4">
					<label for="complemento">Complemento</label>
					<input maxlength="50" type="text" class="form-control" id="complemento" th:field="*{endereco.complemento}"/>
				</div>
			</div>
			
			<div class="row">
				<div class="form-group  col-sm-4">
					<label for="cep">CEP</label>
					<input type="text" class="form-control  js-cep" id="cep" th:field="*{endereco.cep}"/>
				</div>
				
				<div class="form-group  col-sm-4">
					<label for="estado">Estado</label>
					<select id="estado" class="form-control" th:field="*{endereco.estado}">
	                    <option value="">Selecione o estado</option>
	                    <option th:each="estado : ${estados}" 
	                            th:value="${estado.codigo}" 
	                            th:text="${estado.nome}">São Paulo</option>
	                </select>
				</div>
				
				<div class="form-group  col-sm-4">
					<label  for="cidade">Cidade</label>
					<div class="sn-field-action">
						<input type="hidden" id="inputHiddenCidadeSelecionada" th:value="*{endereco.cidade} != null ? *{endereco.cidade.codigo}"/>
						<select id="cidade" class="form-control" data:url="@{/cidades}" th:field="*{endereco.cidade}"> </select>
						
						<div class="sn-field-action__icon  js-img-loading" style="display: none">
							<img th:src="@{/images/mini-loading.gif}"/>
						</div>
					</div>
				</div>
			</div>
			
			<button type="submit" class="btn  btn-primary">Salvar</button>				
		</form>
	</div>
</section>

<th:block layout:fragment="javascript-extra">
	<script th:src="@{/javascripts/obra.combo-estado-cidade.js}"></script>
</th:block>

</html>
