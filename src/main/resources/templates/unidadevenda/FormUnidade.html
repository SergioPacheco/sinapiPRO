<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Unidade de Venda</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10"><h1 th:if="${unidadeVenda.novo}">Nova Unidade</h1><h1 th:unless="${unidadeVenda.novo}" th:text="|Unidade: ${unidadeVenda.identificacao}|">Unidade</h1></div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/unidadesVenda}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${unidadeVenda}"
      th:action="${unidadeVenda.novo} ? @{/unidadesVenda/novo} : @{/unidadesVenda/{c}(c=${unidadeVenda.codigo})}">
    <sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="obra">
            <label class="control-label">Obra</label>
            <select class="form-control" th:field="*{obra}">
                <option value="">Selecione...</option>
                <option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Identificação</label><input type="text" class="form-control" th:field="*{identificacao}"/></div>
        <div class="form-group col-sm-2"><label class="control-label">Tipo</label><input type="text" class="form-control" th:field="*{tipo}"/></div>
        <div class="form-group col-sm-2"><label class="control-label">Bloco</label><input type="text" class="form-control" th:field="*{bloco}"/></div>
        <div class="form-group col-sm-2"><label class="control-label">Andar</label><input type="text" class="form-control" th:field="*{andar}"/></div>
    </div>
    <div class="row">
        <div class="form-group col-sm-2"><label class="control-label">Área Privativa (m²)</label><input type="number" step="0.01" class="form-control" th:field="*{areaPrivativa}"/></div>
        <div class="form-group col-sm-2"><label class="control-label">Área Total (m²)</label><input type="number" step="0.01" class="form-control" th:field="*{areaTotal}"/></div>
        <div class="form-group col-sm-3"><label class="control-label">Valor Base</label><input type="number" step="0.01" class="form-control" th:field="*{valorBase}"/></div>
        <div class="form-group col-sm-3">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="">Selecione...</option>
                <option th:each="s : ${situacoes}" th:value="${s.codigo}" th:text="${s.nome}"></option>
            </select>
        </div>
    </div>
    <div class="form-group"><label class="control-label">Descrição</label><textarea class="form-control" rows="2" th:field="*{descricao}"></textarea></div>
    <h3>Características</h3>
    <table class="table table-bordered table-condensed" id="tblCarac">
        <thead><tr><th>Descrição</th><th>Valor</th><th></th></tr></thead>
        <tbody>
            <tr th:each="c, stat : *{caracteristicas}">
                <input type="hidden" th:field="*{caracteristicas[__${stat.index}__].codigo}"/>
                <td><input type="text" class="form-control input-sm" th:field="*{caracteristicas[__${stat.index}__].descricao}"/></td>
                <td><input type="text" class="form-control input-sm" th:field="*{caracteristicas[__${stat.index}__].valor}"/></td>
                <td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
            </tr>
        </tbody>
    </table>
    <button type="button" class="btn btn-xs btn-default" onclick="addRow()">+ Característica</button>
    <div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idx = document.getElementById('tblCarac').querySelector('tbody').rows.length;
function addRow() {
    var tbody = document.getElementById('tblCarac').querySelector('tbody');
    var row = tbody.insertRow();
    row.innerHTML = '<td><input type="text" class="form-control input-sm" name="caracteristicas['+idx+'].descricao"/></td>' +
        '<td><input type="text" class="form-control input-sm" name="caracteristicas['+idx+'].valor"/></td>' +
        '<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>';
    idx++;
}
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
