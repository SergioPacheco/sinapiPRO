<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Unidades de Venda</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-8"><h1>Unidades de Venda — Espelho</h1></div>
    <div class="col-sm-4 text-right" style="margin-top:20px;">
        <a class="btn btn-success" th:href="@{/unidadesVenda/novo}"><i class="glyphicon glyphicon-plus"></i> Nova</a>
    </div>
</div></div></div>
<div class="container-fluid">
    <form method="GET" class="form-inline" style="margin-bottom:15px;">
        <div class="form-group"><label>Obra</label>
            <select name="codigoObra" class="form-control" onchange="this.form.submit()">
                <option value="">Selecione...</option>
                <option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"
                    th:selected="${codigoObra != null and codigoObra == o.codigo}"></option>
            </select>
        </div>
    </form>
    <div th:if="${unidades != null}">
        <table class="table table-hover table-bordered">
            <thead><tr><th>ID</th><th>Tipo</th><th>Bloco</th><th>Andar</th><th class="text-right">Área Priv.</th><th class="text-right">Valor Base</th><th>Situação</th><th class="table-col-acoes"></th></tr></thead>
            <tbody>
                <tr th:each="u : ${unidades}">
                    <td th:text="${u.identificacao}"></td>
                    <td th:text="${u.tipo}"></td>
                    <td th:text="${u.bloco}"></td>
                    <td th:text="${u.andar}"></td>
                    <td class="text-right" th:text="${u.areaPrivativa != null} ? ${#numbers.formatDecimal(u.areaPrivativa,1,2)} : ''"></td>
                    <td class="text-right" th:text="${#numbers.formatDecimal(u.valorBase,1,2)}"></td>
                    <td>
                        <span th:if="${u.situacao != null}" class="label label-default"
                              th:style="${u.situacao.cor != null} ? 'background-color:' + ${u.situacao.cor} : ''"
                              th:text="${u.situacao.nome}"></span>
                    </td>
                    <td class="text-center"><a class="btn btn-link btn-xs" th:href="@{/unidadesVenda/{c}(c=${u.codigo})}"><i class="glyphicon glyphicon-pencil"></i></a></td>
                </tr>
                <tr th:if="${unidades.isEmpty()}"><td colspan="8">Nenhuma unidade encontrada</td></tr>
            </tbody>
        </table>
    </div>
</div>
</section></body></html>
