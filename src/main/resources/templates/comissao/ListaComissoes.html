<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Comissões</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-xs-10"><h1>Comissões</h1></div>
    <div class="col-xs-2"><a class="btn btn-success" th:href="@{/comissoes/novo}"><i class="glyphicon glyphicon-plus"></i></a></div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
    <thead><tr><th>Corretor</th><th>Unidade</th><th class="text-right">%</th><th class="text-right">Valor</th><th>Pagamento</th><th>Situação</th><th class="table-col-acoes"></th></tr></thead>
    <tbody>
        <tr th:each="c : ${comissoes}">
            <td th:text="${c.nomeCorretor}"></td>
            <td th:text="${c.venda.unidade.identificacao}"></td>
            <td class="text-right" th:text="${#numbers.formatDecimal(c.percentual,1,2) + '%'}"></td>
            <td class="text-right" th:text="${#numbers.formatDecimal(c.valor,1,2)}"></td>
            <td th:text="${c.dataPagamento != null} ? ${#temporals.format(c.dataPagamento,'dd/MM/yyyy')} : ''"></td>
            <td><span class="label" th:classappend="${c.situacao == 'PAGA'} ? 'label-success' : 'label-warning'" th:text="${c.situacao}"></span></td>
            <td class="text-center"><a class="btn btn-link btn-xs" th:href="@{/comissoes/{c}(c=${c.codigo})}"><i class="glyphicon glyphicon-pencil"></i></a></td>
        </tr>
        <tr th:if="${comissoes.isEmpty()}"><td colspan="7">Nenhuma comissão encontrada</td></tr>
    </tbody>
</table>
</div>
</section></body></html>
