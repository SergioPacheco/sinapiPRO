<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}"
	  xmlns:sinapiPRO="http://sinapiPRO.ifrn.edu.br"
	  xmlns:data="http://www.thymeleaf.org/extras/data">

<head>

<title>Orçamento</title>
<link rel="stylesheet" th:href="@{/stylesheets/vendors/easy-autocomplete.min.css}"/>
<link rel="stylesheet" th:href="@{/stylesheets/vendors/easy-autocomplete.themes.min.css}"/>
	
</head>

<section layout:fragment="conteudo">
	<!-- #{mensagem} arquivo messages.properties -->
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-xs-10">
					<h1 th:if="${orcamento.novo}"     th:text="#{orcamento.cadastro.titulo}">BUG. Não deveria incluir o orçamento por aqui</h1>
					<h1 th:unless="${orcamento.novo}" th:text="#{orcamento.edicao.titulo(${orcamento.codigo})}">Orçamento nº </h1>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container-fluid">
		<form method="POST" 
		      th:action="@{/item/novo}" 
		      th:object="${orcamento}" class="js-formulario-principal">
		      
			
			 	
			<input type="hidden" th:field="*{uuid}"          id="uuid" />
			<input th:field="*{etapaCheckBox}" id="etapaCheckBox" />
			<input type="hidden" th:field="*{codigo}"/>
			<input type="hidden" th:field="*{nome}"/>
			<input type="hidden" th:field="*{cliente}"/>
			<input type="hidden" th:field="*{baseInsumo}"/>
			<input type="hidden" th:field="*{basePreco}"/>
			<input type="hidden" th:field="*{estado}"/>
			<input type="hidden" th:field="*{dataCriacao}"/>
			<input type="hidden" th:field="*{usuario}"/>
			
			<!-- totais -->
			
			<div class="row">
				<div class="col-sm-3">
					<div class="aw-box  js-valor-total-box-container">
						<div class="aw-box__icon">
							<i class="fa  fa-usd  fa-2x"></i>
						</div>
						<div class="aw-box__value">R$ <span class="js-valor-total-box" th:text="${{orcamento.valorTotal}}">0,00</span></div>
						<div class="aw-box__title">TOTAL GERAL</div>
					</div>
				</div>
				<div class="col-sm-3">
					<div class="aw-box  js-total-servicos-box-container">
						<div class="aw-box__icon">
							<i class="fa  fa-usd  fa-2x"></i>
						</div>
						<div class="aw-box__value">R$ <span class="js-valor-mao-obra-box" th:text="${{orcamento.valorMaoObra}}">0,00</span></div>
						<div class="aw-box__title">TOTAL MÃO DE OBRA</div>
					</div>
				</div>
				<div class="col-sm-3">
					<div class="aw-box  js-total-materiais-box-container">
						<div class="aw-box__icon">
							<i class="fa  fa-usd  fa-2x"></i>
						</div>
						<div class="aw-box__value">R$<span class="js-valor-material-box" th:text="${{orcamento.valorMaterial}}">0,00</span></div>
						<div class="aw-box__title">TOTAL MATERIAIS</div>
					</div>
				</div>
				<div class="col-sm-3">
					<div class="aw-box  js-total-equipamentos-box-container">
						<div class="aw-box__icon">
							<i class="fa  fa-usd  fa-2x"></i>
						</div>
						<div class="aw-box__value">R$<span class="js-valor-equipamento-box" th:text="${{orcamento.valorEquipamento}}">0,00</span></div>
						<div class="aw-box__title">TOTAL EQUIPAMENTOS</div>
					</div>
				</div>
				 
			</div> 	<!-- fim totais -->	
			
			<div class="row">
				<div class="form-group  col-lg-12">
					<ul class="nav nav-pills">
					  <li class="active">  <a data-toggle="pill" href="#composicoes">COMPOSIÇÕES</a></li>
					  <li><a data-toggle="pill" href="#insumos">INSUMOS</a></li>
					  <li><a data-toggle="pill" href="#etapas">ETAPAS</a></li>
					</ul>
				</div>
			</div>
			
			<div class="tab-content">
				<div class="tab-pane fade in active" id="composicoes" >
					<div class="row">
						<div class="col-lg-12">
							<input type="text" 
							       class="form-control  js-composicao-input" 
							       id="composicao" 
								   placeholder="Pesquise e adicione a composicao pelo Código ou Nome" 
								   data:url="@{/composicoes}"/>
						</div>
					</div>
				</div>
				
				<div class="tab-pane fade" id="insumos">
					 <div class="row" >
						<div class="form-group  col-lg-12" >
							<input type="text" 
							       class="form-control  js-insumo-input" 
							       id="insumo" 
								   placeholder="Pesquise e adicione o insumo pelo Código ou Nome" 
								   data:url="@{/insumos}"/>
						</div>
					</div>
				</div>
				
				<div class="tab-pane fade" id="etapas">
					 
					 <div class="row">
						<div class="form-group  col-lg-12">
							<input type="text" 
							       class="form-control  js-etapa-input" 
							       id="etapa" 
								   placeholder="Pesquise e adicione a etapa pelo Código ou Nome" 
								   data:url="@{/etapas}"/>
						</div>
					</div>
				</div>
				
				
				<!-- Lista items  -->
				<div class="sn-tabela-composicoes  js-tabela-item-container" 
				     data:valor-total="${valorTotalItens}"
				     data:valor-mao-obra="${valorMaoObraItens}"
				     data:valor-material="${valorMaterialItens}"
				     data:valor-equipamento="${valorEquipamentoItens}">
				     
					 <th:block th:replace="orcamento/TabelaItensOrcamento"/>
					 
				</div>
			</div>
			 
			<div class="row" style="clear: both">
				<div class="col-lg-12">
					<div class="btn-group">
					  <button type="submit" class="btn  btn-primary  js-submit-btn" data:acao="salvar">Salvar</button>
					  <button type="button" class="btn  btn-primary  dropdown-toggle" data-toggle="dropdown">
					    <span class="caret"></span>
					  </button>
					  
					  <ul class="dropdown-menu">
					    <li><a href="#" class="js-submit-btn" data:acao="efetivar">Salvar e efetivar</a></li>
					    <li><a href="#" class="js-submit-btn" data:acao="concluir">Salvar e concluir</a></li>
					    <li><a href="#" class="js-submit-btn" data:acao="bloquear">Salvar e bloquear</a></li>
					  </ul>
					</div>
				
					<button class="btn  btn-danger  js-submit-btn" 
					        data:acao="cancelar" 
					        th:unless="${orcamento.novo}">Cancelar</button>
				</div>
			</div>
			<sinapiPRO:message/>
		</form>
		
	</div>
	
	<th:block th:replace="hbs/TemplateAutocompleteComposicao"></th:block>  
	<th:block th:replace="hbs/TemplateAutocompleteInsumo"></th:block>  
	<th:block th:replace="hbs/TemplateAutocompleteEtapa"></th:block>  
	
</section>

<th:block layout:fragment="javascript-extra">
	<script th:src="@{/javascripts/vendors/jquery.easy-autocomplete.min.js}"></script>
	<script th:src="@{/javascripts/vendors/handlebars.min.js}"></script>
	<script th:src="@{/javascripts/orcamento/orcamento.autocomplete-composicao.js}"></script>
	<script th:src="@{/javascripts/orcamento/orcamento.autocomplete-insumo.js}"></script>
	<script th:src="@{/javascripts/orcamento/orcamento.autocomplete-etapa.js}"></script>
	<script th:src="@{/javascripts/orcamento/orcamento.tabela-itens.js}"></script>
	<script th:src="@{/javascripts/orcamento/orcamento.js}"></script>
	<script th:src="@{/javascripts/orcamento/orcamento.botoes-submit.js}"></script>
</th:block>

</html>
