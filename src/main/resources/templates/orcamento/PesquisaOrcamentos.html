<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org"
 	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}"
	  xmlns:sinapiPRO="http://sinapiPRO.ifrn.edu.br"
	xmlns:data="http://www.thymeleaf.org/extras/data">
	
<head>
	<title>Pesquisa de orçamentoss</title>
</head>

<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-xs-10">
					<h1>Pesquisa de orçamentos</h1>
				</div>
				
				<div class="col-xs-2">
					<div class="aw-page-header-controls">
						<a class="btn  btn-default" th:href="@{/orcamentos/novo}">
							<i class="glyphicon  glyphicon-plus-sign"></i> 
							<span class="hidden-xs  hidden-sm">Novo orçamento</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container-fluid">
	
		<form method="GET" th:object="${orcamentoFilter}">
		
			<div class="row">
				<div class="form-group  col-sm-12">
					<label class="control-label" for="nome">Descrição</label>
					<input type="text" class="form-control" id="nome" th:field="*{nome}"/>
				</div>
			</div>
			<button type="submit" class="btn  btn-primary">Pesquisar</button>
		</form>
		
		<div class="table-responsive  sn-tabela-simples">
			<table class="table  table-hover">
	            <thead>
	            	<tr>
	                	<th class="table-orcamento-col-codigo">Código</th>
	                	<th class="table-orcamento-col-obra">Obra</th>
	                	<th class="table-orcamento-col-situacao">Situacao</th>
	                 	<th class="table-col-acoes"></th>
					</tr>
				</thead>
				
	            <tbody>
					<tr th:each="orcamento : ${pagina.conteudo}">
						<td class="text-center" th:text="${orcamento.codigo}"></td>
						<td class="text-left" th:text="${orcamento.nome}"></td>
						<td class="text-center">
							<th:block>
								<span class="label  label-success"
							          th:text="${orcamento.situacao}"> </span>
							</th:block>
						</td>
	                 	<td class="text-center">
		   					<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" 
		   					   th:href="@{/orcamentos/{codigo}(codigo=${orcamento.codigo})}">
		   					   <i class="glyphicon glyphicon-pencil"></i>
		   					</a>
		   					<a class="btn  btn-link  btn-xs  js-tooltip  js-exclusao-btn" title="Excluir" 
							   href="#" data:url="@{/orcamentos/{codigo}(codigo=${orcamento.codigo})}"
							   data:objeto="${orcamento.nome}"> <i class="glyphicon glyphicon-remove"></i>
							</a>
		   					<!-- null point 
		   					<a class="btn  btn-link  btn-xs  js-tooltip" title="Itens do Orçamento" 
		   					   th:href="@{/atual/{codigo}(codigo=${orcamento.codigo})}">
		   					   <i class="glyphicon glyphicon-th-list"></i>
		   					</a>
		   					 -->
	                 	</td>
	                </tr>
	                
	                <tr th:if="${pagina.vazia}">
	                	<td colspan="7">Nenhum orçamento encontrado</td>
	                </tr>
	            </tbody>
	         </table>
		</div>
		<sinapiPRO:pagination page="${pagina}"/>
	</div>
</section>
</body>
</html>
