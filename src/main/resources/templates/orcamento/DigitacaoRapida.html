<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Digitação Rápida</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<h1>Digitação Rápida — <small th:text="${orcamento.nome}"></small></h1>
		</div>
	</div>
	<div class="container-fluid">
		<div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

		<form th:action="@{/digitacaoRapida/{id}(id=${orcamento.codigo})}" method="post" class="form-inline" style="margin-bottom:15px;">
			<div class="form-group">
				<label>Descrição</label>
				<input type="text" name="descricao" class="form-control" style="width:300px;" required autofocus />
			</div>
			<div class="form-group" style="margin-left:8px;">
				<label>Unidade</label>
				<input type="text" name="unidade" class="form-control" style="width:60px;" placeholder="un" />
			</div>
			<div class="form-group" style="margin-left:8px;">
				<label>Qtd</label>
				<input type="number" step="0.01" name="quantidade" class="form-control" style="width:100px;" required />
			</div>
			<div class="form-group" style="margin-left:8px;">
				<label>Vl. Unitário</label>
				<input type="number" step="0.0001" name="valorUnitario" class="form-control" style="width:120px;" required />
			</div>
			<button type="submit" class="btn btn-success" style="margin-left:10px;">
				<i class="glyphicon glyphicon-plus"></i> Adicionar
			</button>
		</form>

		<h3>Itens do Orçamento (<span th:text="${orcamento.itens.size()}"></span>)</h3>
		<div class="table-responsive">
			<table class="table table-bordered table-condensed table-striped">
				<thead>
					<tr class="active">
						<th>Descrição</th>
						<th>Unidade</th>
						<th class="text-right">Qtd</th>
						<th class="text-right">Vl. Unitário</th>
						<th class="text-right">Total</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item : ${orcamento.itens}">
						<td th:text="${item.descricao}"></td>
						<td th:text="${item.unidade}"></td>
						<td class="text-right" th:text="${item.quantidade != null} ? ${#numbers.formatDecimal(item.quantidade, 1, 2)} : '-'"></td>
						<td class="text-right" th:text="${item.valorUnitario != null} ? ${#numbers.formatDecimal(item.valorUnitario, 1, 4)} : '-'"></td>
						<td class="text-right" th:text="${item.valorTotal != null} ? ${#numbers.formatDecimal(item.valorTotal, 1, 2)} : '-'"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>
</body>
</html>
