<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}"
	  xmlns:sinapiPRO="http://sinapiPRO.ifrn.edu.br"
	  xmlns:data="http://www.thymeleaf.org/extras/data">

<head>
	<title>Cadastro do Orçamento</title>
	
	<link rel="stylesheet" th:href="@{/stylesheets/vendors/easy-autocomplete.min.css}"/>
	<link rel="stylesheet" th:href="@{/stylesheets/vendors/easy-autocomplete.themes.min.css}"/>
</head>

<section layout:fragment="conteudo">

	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-xs-10">
					<h1 th:if="${orcamento.nova}"     
					    th:text="#{orcamento.cadastro.titulo}">Cadastro do Orçamento</h1>
					<h1 th:unless="${orcamento.nova}"
					    th:text="#{orcamento.edicao.titulo(${orcamento.codigo})}">Edição do orçamento nº </h1>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container-fluid">
		<form method="POST" 
		      th:action="@{/orcamentos/novo}" 
		      th:object="${orcamento}"  
		      class="form-vertical  js-form-loading" 
		      th:action="${orcamento.novo} ? @{/orcamento/novo} : @{/orcamento/{codigo}(codigo=${orcamento.codigo})}">
			<sinapiPRO:message/>
		
			<input type="hidden" th:field="*{codigo}"/>
		    <input type="hidden" th:field="${orcamento.situacao.descricao}"/>
			<input type="hidden" id="uuid" th:field="*{uuid}"/>
			<input type="hidden" th:field="*{usuario}"/>
			
			
			<div class="row">
			     
				<div class="form-group col-sm-12    bw-required" sinapiPRO:classforerror="nome">
					<label for="nome" class="control-label">Nome</label>
					<input id="nome" type="text" class="form-control" th:field="*{nome}" />
				</div>	
			</div>
			
			<div class="row">
			
				<div class="form-group  col-sm-3">
					<label for="estado">Estado</label>
					<select id="estado" class="form-control" th:field="*{estado}">
					
	                    <option value="">Selecione o estado</option>
	                
	                    <option th:each="estado : ${estados}" 
	                            th:value="${estado.codigo}" 
	                            th:text="${estado.nome}">São Paulo</option>
	                </select>
				</div>
				 
				<div class="form-group  col-sm-3">
					<label for="baseInsumo">Base Insumos Padrão</label>
					<select id="baseInsumo" class="form-control" th:field="*{baseInsumo}">
	                    
	                    <option value="">Selecione a Base de Insumos</option>
	                    
	                    <option th:each="baseInsumo : ${baseInsumos}" 
	                            th:value="${baseInsumo.codigo}" 
	                            th:text="${baseInsumo.nome}">SINAPI</option>
	                </select>
				</div>
				
				<div class="form-group  col-sm-3">
					<label for="basePreco">Base Preços Padrão</label>
					<select id="basePreco" class="form-control" th:field="*{basePreco}">
	                    
	                    <option value="">Selecione a Base de Preços</option>
	                    
	                    <option th:each="basePreco : ${basePrecos}" 
	                            th:value="${basePreco.codigo}" 
	                            th:text="${basePreco.nome}">RN SINAPI 2018-01</option>
	                </select>
				</div>
				
			</div>
			
			<div class="row">
				<div class="form-group  col-sm-6  bw-required" sinapiPRO:classforerror="cliente.codigo">
					<label class="control-label" for="nomeCliente">Cliente</label>
					<div class="input-group">
				      <input id="nomeCliente" type="text" readonly="readonly" class="form-control" th:field="*{cliente.nome}" 
				      	placeholder="Clique na lupa para pesquisar o cliente"/>
				      <input id="codigoCliente" type="hidden" th:field="*{cliente}"/>
				      <span class="input-group-btn">
					        <button class="btn  btn-default  js-tooltip" type="button" title="Pesquisa avançada"
					        		data-toggle="modal" data-target="#pesquisaRapidaClientes" th:disabled="${orcamento.salvarProibido}">
					        	<i class="glyphicon  glyphicon-search"></i>
					        </button>
				      </span>
				    </div>
				</div>
			</div>
			
			<div class="row">
				 <div class="col-sm-6  form-group bw-required" sinapiPRO:classforerror="descricao">
					<label for="descricao" class="control-label">Descricao</label>
					<textarea id="descricao" rows="4" class="form-control" th:field="*{descricao}"></textarea>
				</div>
			</div>
			
			<div class="row" style="clear: both" th:if="${orcamento.salvarPermitido}">
				<div class="col-lg-12">
					<div class="btn-group">
					  <button type="submit" class="btn  btn-primary  js-submit-btn" data:acao="salvar">Salvar</button>
					  <button type="button" class="btn  btn-primary  dropdown-toggle" data-toggle="dropdown">
					    <span class="caret"></span>
					  </button>
					  
					  <ul class="dropdown-menu">
					    <li><a href="#" class="js-submit-btn" data:acao="emitir">Salvar e emitir</a></li>
					    <li><a href="#" class="js-submit-btn" data:acao="enviarEmail">Salvar e enviar por e-mail</a></li>
					  </ul>
					</div>
				
					<button class="btn  btn-danger  js-submit-btn" data:acao="cancelar" th:unless="${orcamento.nova}">Cancelar</button>
				</div>
			</div>
		</form>
	</div>
	
	<th:block th:replace="cliente/PesquisaRapidaClientes :: pesquisaRapidaClientes"></th:block>
	<th:block th:replace="hbs/TemplateAutocompleteComposicao"></th:block>
</section>

<th:block layout:fragment="javascript-extra">
	<script th:src="@{/javascripts/vendors/handlebars.min.js}"></script>
	<script th:src="@{/javascripts/cliente.pesquisa-rapida.js}"></script>
	<script th:src="@{/javascripts/orcamento.botoes-submit.js}"></script>
	<script>
	
	</script>
</th:block>

</html>
