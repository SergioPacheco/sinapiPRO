<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Relatório - Global Material + Mão de Obra</title></head>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid"><h1>Relatório Global Material + Mão de Obra</h1></div>
	</div>
	<div class="container-fluid">
		<div th:if="${orcamento == null}" class="alert alert-warning">
			Nenhum orçamento selecionado. <a th:href="@{/orcamentos}">Selecione um orçamento</a>.
		</div>
		<div th:if="${orcamento != null}">
			<h3 th:text="${orcamento.nome}">Orçamento</h3>
			<div class="row">
				<div class="col-sm-6">
					<div class="panel panel-info">
						<div class="panel-heading"><strong>Mão de Obra</strong></div>
						<div class="panel-body">
							<table class="table table-condensed">
								<thead><tr><th>Descrição</th><th class="text-right">Valor</th></tr></thead>
								<tbody>
									<tr th:each="item : ${itensMaoObra}">
										<td th:text="${item.descricao}"></td>
										<td class="text-right" th:text="${#numbers.formatDecimal(item.valorMaoObra ?: 0, 1, 2)}"></td>
									</tr>
								</tbody>
								<tfoot><tr class="active"><td><strong>Total Mão de Obra</strong></td>
									<td class="text-right"><strong th:text="${#numbers.formatDecimal(totalMaoObra, 1, 2)}"></strong></td></tr></tfoot>
							</table>
						</div>
					</div>
				</div>
				<div class="col-sm-6">
					<div class="panel panel-success">
						<div class="panel-heading"><strong>Material</strong></div>
						<div class="panel-body">
							<table class="table table-condensed">
								<thead><tr><th>Descrição</th><th class="text-right">Valor</th></tr></thead>
								<tbody>
									<tr th:each="item : ${itensMaterial}">
										<td th:text="${item.descricao}"></td>
										<td class="text-right" th:text="${#numbers.formatDecimal(item.valorMaterial ?: 0, 1, 2)}"></td>
									</tr>
								</tbody>
								<tfoot><tr class="active"><td><strong>Total Material</strong></td>
									<td class="text-right"><strong th:text="${#numbers.formatDecimal(totalMaterial, 1, 2)}"></strong></td></tr></tfoot>
							</table>
						</div>
					</div>
				</div>
			</div>
			<div class="panel panel-warning">
				<div class="panel-heading"><strong>Resumo por Espécie</strong></div>
				<table class="table">
					<tr><td>Mão de Obra</td><td class="text-right" th:text="${#numbers.formatDecimal(totalMaoObra, 1, 2)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(percMaoObra, 1, 2) + '%'}"></td></tr>
					<tr><td>Material</td><td class="text-right" th:text="${#numbers.formatDecimal(totalMaterial, 1, 2)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(percMaterial, 1, 2) + '%'}"></td></tr>
					<tr><td>Equipamento</td><td class="text-right" th:text="${#numbers.formatDecimal(totalEquipamento, 1, 2)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(percEquipamento, 1, 2) + '%'}"></td></tr>
					<tr class="success"><td><strong>Total</strong></td>
						<td class="text-right"><strong th:text="${#numbers.formatDecimal(totalGeral, 1, 2)}"></strong></td>
						<td class="text-right"><strong>100%</strong></td></tr>
				</table>
			</div>
		</div>
	</div>
</section>
</html>
