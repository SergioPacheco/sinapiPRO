<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
  	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">

<head> 
	<title>Relatório - Orçamentos Emitidos</title> 
</head>

<section layout:fragment="conteudo">

	<div class="page-header">
		<div class="container-fluid">
			<h1>
				Relação de Insumos Por Base
			</h1>
		</div>
	</div>
	
	<div class="container-fluid">
		<form method="POST" 
		      th:object="${listaInsumos}" 
		      th:action="@{/relatorios/listaInsumos}">
		      
			<th:block th:include="fragments/MensagensErroValidacao"></th:block>
			
			<div class="row">
				<div class="form-group  col-sm-3">
					<label for="baseInsumo">Base Insumos</label>
					<select id="baseInsumo" class="form-control" th:field="*{baseInsumo}">
	                    
	                    <option value="">Selecione a Base de Insumos</option>
	                    
	                    <option th:each="baseInsumo : ${baseInsumos}" 
	                            th:value="${baseInsumo.codigo}" 
	                            th:text="${baseInsumo.nome}">SINAPI</option>
	                </select>
				</div>
				
				<div class="col-sm-3  form-group">
					<label for="especie" class="control-label">Espécie</label>
					<select id="especie" class="form-control" th:field="*{especie}">
						<option value="">Selecione a espécie</option>
						<option th:each="especie : ${especies}" 
						        th:value="${especie}" 
						        th:text="${especie.descricao}">Materiais</option>
					</select>
				</div>
				
				<div class="form-group col-sm-3">
					<label class="control-label">Ordenar por:</label> 	 	
					<div class="form-check">
						<input class="form-check-input" type="radio" name="ordem"  
						       id="identificacao" value="insumo.codigo" checked>
						<label class="form-check-label" for="identificacao">
					    Identificação
					  </label>
					</div>
					<div class="form-check">
					  <input class="form-check-input" type="radio" name="ordem"  
					         id="descricao" value="insumo.descricao">
					  <label class="form-check-label" for="descricao">
					    Descrição
					  </label>
					</div>
					<div class="form-check">
					  <input class="form-check-input" type="radio" name="ordem"  
					         id="valor" value="insumo.preco_padrao">
					  <label class="form-check-label" for="valor">
					    Valor
					  </label>
					</div>
				</div>
				
				<div class="form-group col-sm-3">
					<label class="control-label">Tipo da Ordem:</label> 	 	
					<div class="form-check">
						<input class="form-check-input" type="radio" name="tipoOrdem"  
						       id="crescente" value="ASC" checked>
						<label class="form-check-label" for="crescente">
					    Crescente
					  </label>
					</div>
					<div class="form-check">
					  <input class="form-check-input" type="radio" name="tipoOrdem" 
					         id="decrescente" value="DESC">
					  <label class="form-check-label" for="decrescente">
					   Decrescente
					  </label>
					</div>
				</div>
				
				
			</div>
			<button type="submit" class="btn  btn-primary">Emitir</button>
		</form>
	</div>
</section>

</html>
