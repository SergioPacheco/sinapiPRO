<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Relatório - Orçamento Analítico</title></head>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid"><h1>Relatório Orçamento Analítico</h1></div>
	</div>
	<div class="container-fluid">
		<div th:if="${orcamento == null}" class="alert alert-warning">
			Nenhum orçamento selecionado. <a th:href="@{/orcamentos}">Selecione um orçamento</a>.
		</div>
		<div th:if="${orcamento != null}">
			<div class="panel panel-default">
				<div class="panel-heading"><strong th:text="${orcamento.nome}">Orçamento</strong>
					<span class="pull-right" th:text="|Tipo: ${orcamento.tipoOrcamento.descricao}|"></span>
				</div>
				<div class="panel-body">
					<div class="row">
						<div class="col-sm-3"><strong>Obra:</strong> <span th:text="${orcamento.obra?.nome}"></span></div>
						<div class="col-sm-3"><strong>Cliente:</strong> <span th:text="${orcamento.cliente?.nome}"></span></div>
						<div class="col-sm-3"><strong>Estado:</strong> <span th:text="${orcamento.estado?.nome}"></span></div>
						<div class="col-sm-3"><strong>Situação:</strong> <span th:text="${orcamento.situacao?.descricao}"></span></div>
					</div>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-striped table-condensed">
					<thead>
						<tr>
							<th>Item</th>
							<th>Descrição</th>
							<th>Tipo</th>
							<th>Unidade</th>
							<th class="text-right">Qtd</th>
							<th class="text-right">Vl. Unit.</th>
							<th class="text-right">Mão de Obra</th>
							<th class="text-right">Material</th>
							<th class="text-right">Equipamento</th>
							<th class="text-right">Total</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="item : ${orcamento.itens}">
							<td th:text="${item.itemizacao}"></td>
							<td th:text="${item.descricao}"></td>
							<td th:text="${item.tipo}"></td>
							<td th:text="${item.unidade}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.quantidade ?: 0, 1, 4)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorUnitario ?: 0, 1, 2)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorMaoObra ?: 0, 1, 2)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorMaterial ?: 0, 1, 2)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorEquipamento ?: 0, 1, 2)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorTotal ?: 0, 1, 2)}"></td>
						</tr>
					</tbody>
					<tfoot>
						<tr class="active">
							<td colspan="6"><strong>Sub-Total</strong></td>
							<td class="text-right"><strong th:text="${#numbers.formatDecimal(orcamento.calculaValorMaoObra(), 1, 2)}"></strong></td>
							<td class="text-right"><strong th:text="${#numbers.formatDecimal(orcamento.calculaValorMaterial(), 1, 2)}"></strong></td>
							<td class="text-right"><strong th:text="${#numbers.formatDecimal(orcamento.calculaValorEquipamento(), 1, 2)}"></strong></td>
							<td class="text-right"><strong th:text="${#numbers.formatDecimal(orcamento.calculaValorSubTotal(), 1, 2)}"></strong></td>
						</tr>
						<tr><td colspan="9">Leis Sociais (<span th:text="${orcamento.percentualLeisSociais}"></span>%)</td>
							<td class="text-right" th:text="${#numbers.formatDecimal(orcamento.calculaValorLeisSociais(), 1, 2)}"></td></tr>
						<tr><td colspan="9">BDI (<span th:text="${orcamento.percentualBdi}"></span>%)</td>
							<td class="text-right" th:text="${#numbers.formatDecimal(orcamento.calculaValorBDI(), 1, 2)}"></td></tr>
						<tr><td colspan="9">Taxa Adm. (<span th:text="${orcamento.percentualTaxaAdm}"></span>%)</td>
							<td class="text-right" th:text="${#numbers.formatDecimal(orcamento.calculaValorTaxaAdm(), 1, 2)}"></td></tr>
						<tr class="success"><td colspan="9"><strong>TOTAL GERAL</strong></td>
							<td class="text-right"><strong th:text="${#numbers.formatDecimal(orcamento.calculaValorTotalComTaxas(), 1, 2)}"></strong></td></tr>
					</tfoot>
				</table>
			</div>
			<form method="POST" th:action="@{/relatorios/imprimirOrcamento}" class="form-inline">
				<input type="hidden" name="codigo" th:value="${orcamento.codigo}"/>
				<button type="submit" class="btn btn-primary"><i class="glyphicon glyphicon-print"></i> Imprimir PDF</button>
				<a class="btn btn-default" th:href="@{/relatorios/exportCsv/{codigo}(codigo=${orcamento.codigo})}"><i class="glyphicon glyphicon-download"></i> CSV</a>
				<a class="btn btn-default" th:href="@{/relatorios/exportRtf/{codigo}(codigo=${orcamento.codigo})}"><i class="glyphicon glyphicon-download"></i> RTF</a>
			</form>
		</div>
	</div>
</section>
</html>
