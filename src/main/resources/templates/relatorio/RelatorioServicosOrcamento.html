<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Relatório - Serviços do Orçamento</title></head>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid"><h1>Relatório de Serviços do Orçamento</h1></div>
	</div>
	<div class="container-fluid">
		<div th:if="${orcamento == null}" class="alert alert-warning">
			Nenhum orçamento selecionado. <a th:href="@{/orcamentos}">Selecione um orçamento</a>.
		</div>
		<div th:if="${orcamento != null}">
			<h3 th:text="${orcamento.nome}">Orçamento</h3>
			<div class="table-responsive">
				<table class="table table-striped table-condensed">
					<thead>
						<tr>
							<th>Item</th>
							<th>Código</th>
							<th>Descrição do Serviço</th>
							<th>Unidade</th>
							<th class="text-right">Qtd</th>
							<th class="text-right">Vl. Unitário</th>
							<th class="text-right">Total</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="item : ${servicos}">
							<td th:text="${item.itemizacao}"></td>
							<td th:text="${item.composicao?.codigo}"></td>
							<td th:text="${item.descricao}"></td>
							<td th:text="${item.unidade}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.quantidade ?: 0, 1, 4)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorUnitario ?: 0, 1, 2)}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorTotal ?: 0, 1, 2)}"></td>
						</tr>
					</tbody>
					<tfoot>
						<tr class="success">
							<td colspan="6"><strong>Total Serviços</strong></td>
							<td class="text-right"><strong th:text="${#numbers.formatDecimal(totalServicos, 1, 2)}"></strong></td>
						</tr>
					</tfoot>
				</table>
			</div>
		</div>
	</div>
</section>
</html>
