<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Serviços do Orçamento</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<h1>Serviços do Orçamento — <span th:text="${orcamento.nome}"></span></h1>
		</div>
	</div>
	<div class="container-fluid">
		<table class="table table-condensed table-striped">
			<thead>
				<tr>
					<th>Item</th><th>Código</th><th>Descrição</th><th>Und</th>
					<th class="text-right">Qtd</th><th class="text-right">Vl.Unit</th><th class="text-right">Total</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${servicos}">
					<td th:text="${item.itemizacao}"></td>
					<td th:text="${item.composicao?.codigoComposicao}"></td>
					<td th:text="${item.descricao}"></td>
					<td th:text="${item.unidade}"></td>
					<td class="text-right" th:text="${#numbers.formatDecimal(item.quantidade ?: 0, 1, 4)}"></td>
					<td class="text-right" th:text="${#numbers.formatDecimal(item.valorUnitario ?: 0, 1, 2)}"></td>
					<td class="text-right" th:text="${#numbers.formatDecimal(item.valorTotal ?: 0, 1, 2)}"></td>
				</tr>
				<tr th:if="${#lists.isEmpty(servicos)}">
					<td colspan="7">Nenhum serviço (composição) encontrado</td>
				</tr>
			</tbody>
			<tfoot>
				<tr class="active">
					<td colspan="6"><strong>Total Serviços</strong></td>
					<td class="text-right"><strong th:text="'R$ ' + ${#numbers.formatDecimal(totalServicos, 1, 2)}"></strong></td>
				</tr>
			</tfoot>
		</table>
	</div>
</section>
</body>
</html>
