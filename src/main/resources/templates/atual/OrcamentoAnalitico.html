<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Orçamento Analítico</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<h1>Orçamento Analítico — <span th:text="${orcamento.nome}"></span></h1>
		</div>
	</div>
	<div class="container-fluid">
		<div class="row" style="margin-bottom:15px">
			<div class="col-sm-3"><strong>BDI:</strong> <span th:text="${orcamento.percentualBdi}"></span>%</div>
			<div class="col-sm-3"><strong>Leis Sociais:</strong> <span th:text="${orcamento.percentualLeisSociais}"></span>%</div>
			<div class="col-sm-3"><strong>Taxa Adm:</strong> <span th:text="${orcamento.percentualTaxaAdm}"></span>%</div>
			<div class="col-sm-3"><strong>Tipo:</strong> <span th:text="${orcamento.tipoOrcamento?.descricao}"></span></div>
		</div>
		<div th:each="etapaGroup : ${etapas}">
			<h4 th:text="${etapaGroup.key.nome}" style="background:#f5f5f5;padding:8px;margin-top:15px"></h4>
			<table class="table table-condensed table-striped">
				<thead>
					<tr>
						<th>Item</th><th>Descrição</th><th>Und</th>
						<th class="text-right">Qtd</th><th class="text-right">Vl.Unit</th>
						<th class="text-right">MO</th><th class="text-right">Mat</th>
						<th class="text-right">Equip</th><th class="text-right">Total</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item : ${etapaGroup.value}">
						<td th:text="${item.itemizacao}"></td>
						<td th:text="${item.descricao}"></td>
						<td th:text="${item.unidade}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(item.quantidade ?: 0, 1, 4)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(item.valorUnitario ?: 0, 1, 2)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(item.valorMaoObra ?: 0, 1, 2)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(item.valorMaterial ?: 0, 1, 2)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(item.valorEquipamento ?: 0, 1, 2)}"></td>
						<td class="text-right"><strong th:text="${#numbers.formatDecimal(item.valorTotal ?: 0, 1, 2)}"></strong></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="well" style="margin-top:20px">
			<div class="row">
				<div class="col-sm-3"><strong>SubTotal:</strong> R$ <span th:text="${#numbers.formatDecimal(subtotal, 1, 2)}"></span></div>
				<div class="col-sm-3"><strong>Taxas:</strong> R$ <span th:text="${#numbers.formatDecimal(taxas, 1, 2)}"></span></div>
				<div class="col-sm-3"><strong>Tributos:</strong> R$ <span th:text="${#numbers.formatDecimal(tributos, 1, 2)}"></span></div>
				<div class="col-sm-3"><strong>Total:</strong> R$ <span th:text="${#numbers.formatDecimal(total, 1, 2)}"></span></div>
			</div>
		</div>
	</div>
</section>
</body>
</html>
