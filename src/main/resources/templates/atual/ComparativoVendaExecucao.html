<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Comparativo Venda vs Execução</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<h1>Comparativo: Venda vs Execução</h1>
		</div>
	</div>
	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-6">
				<h3>Venda — <span th:text="${venda.nome}"></span></h3>
				<table class="table table-condensed table-striped">
					<thead><tr><th>Item</th><th>Descrição</th><th class="text-right">Total</th></tr></thead>
					<tbody>
						<tr th:each="item : ${venda.itens}" th:if="${item.tipo?.name() != 'ETAPA'}">
							<td th:text="${item.itemizacao}"></td>
							<td th:text="${item.descricao}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorTotal ?: 0, 1, 2)}"></td>
						</tr>
					</tbody>
					<tfoot><tr class="active">
						<td colspan="2"><strong>Total</strong></td>
						<td class="text-right"><strong th:text="'R$ ' + ${#numbers.formatDecimal(totalVenda, 1, 2)}"></strong></td>
					</tr></tfoot>
				</table>
			</div>
			<div class="col-sm-6">
				<h3>Execução — <span th:text="${execucao.nome}"></span></h3>
				<table class="table table-condensed table-striped">
					<thead><tr><th>Item</th><th>Descrição</th><th class="text-right">Total</th></tr></thead>
					<tbody>
						<tr th:each="item : ${execucao.itens}" th:if="${item.tipo?.name() != 'ETAPA'}">
							<td th:text="${item.itemizacao}"></td>
							<td th:text="${item.descricao}"></td>
							<td class="text-right" th:text="${#numbers.formatDecimal(item.valorTotal ?: 0, 1, 2)}"></td>
						</tr>
					</tbody>
					<tfoot><tr class="active">
						<td colspan="2"><strong>Total</strong></td>
						<td class="text-right"><strong th:text="'R$ ' + ${#numbers.formatDecimal(totalExecucao, 1, 2)}"></strong></td>
					</tr></tfoot>
				</table>
			</div>
		</div>
		<div class="row">
			<div class="col-sm-12">
				<table class="table table-bordered">
					<tr>
						<th>Diferença (Execução - Venda)</th>
						<td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(diferenca, 1, 2)}"></td>
						<td class="text-right" th:text="${#numbers.formatDecimal(percentualDiferenca, 1, 2)} + '%'"></td>
					</tr>
				</table>
			</div>
		</div>
	</div>
</section>
</body>
</html>
