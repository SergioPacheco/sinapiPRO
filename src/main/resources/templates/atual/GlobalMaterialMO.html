<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Global Material + Mão de Obra</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<h1>Global Material + Mão de Obra — <span th:text="${orcamento.nome}"></span></h1>
		</div>
	</div>
	<div class="container-fluid">
		<table class="table table-bordered">
			<thead>
				<tr class="active">
					<th>Espécie</th>
					<th class="text-right">Valor</th>
					<th class="text-right">% do Total</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>Mão de Obra</td>
					<td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(maoObra, 1, 2)}"></td>
					<td class="text-right" th:text="${#numbers.formatDecimal(percMO, 1, 2)} + '%'"></td>
				</tr>
				<tr>
					<td>Material</td>
					<td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(material, 1, 2)}"></td>
					<td class="text-right" th:text="${#numbers.formatDecimal(percMat, 1, 2)} + '%'"></td>
				</tr>
				<tr>
					<td>Equipamento</td>
					<td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(equipamento, 1, 2)}"></td>
					<td class="text-right" th:text="${#numbers.formatDecimal(percEquip, 1, 2)} + '%'"></td>
				</tr>
				<tr class="active">
					<td><strong>SubTotal</strong></td>
					<td class="text-right"><strong th:text="'R$ ' + ${#numbers.formatDecimal(subtotal, 1, 2)}"></strong></td>
					<td class="text-right"><strong>100%</strong></td>
				</tr>
				<tr><td>Leis Sociais</td><td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(leisSociais, 1, 2)}"></td><td></td></tr>
				<tr><td>BDI</td><td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(bdi, 1, 2)}"></td><td></td></tr>
				<tr><td>Taxa Adm</td><td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(taxaAdm, 1, 2)}"></td><td></td></tr>
				<tr><td>Tributos</td><td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(tributos, 1, 2)}"></td><td></td></tr>
				<tr class="success">
					<td><strong>TOTAL GERAL</strong></td>
					<td class="text-right"><strong th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 2)}"></strong></td>
					<td></td>
				</tr>
			</tbody>
		</table>
	</div>
</section>
</body>
</html>
