<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cheques</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-xs-10"><h1>Cheques</h1></div>
    <div class="col-xs-2"><a class="btn btn-success" th:href="@{/cheques/novo}"><i class="glyphicon glyphicon-plus"></i></a></div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
    <thead><tr><th>Número</th><th>Beneficiário</th><th>Emissão</th><th>Bom Para</th><th class="text-right">Valor</th><th>Situação</th><th class="table-col-acoes"></th></tr></thead>
    <tbody>
        <tr th:each="c : ${cheques}">
            <td th:text="${c.numero}"></td>
            <td th:text="${c.beneficiario}"></td>
            <td th:text="${#temporals.format(c.dataEmissao,'dd/MM/yyyy')}"></td>
            <td th:text="${c.dataBomPara != null} ? ${#temporals.format(c.dataBomPara,'dd/MM/yyyy')} : ''"></td>
            <td class="text-right" th:text="${#numbers.formatDecimal(c.valor,1,2)}"></td>
            <td><span class="label" th:classappend="${c.situacao == 'EMITIDO'} ? 'label-warning' : (${c.situacao == 'COMPENSADO'} ? 'label-success' : 'label-default')" th:text="${c.situacao}"></span></td>
            <td class="text-center"><a class="btn btn-link btn-xs" th:href="@{/cheques/{c}(c=${c.codigo})}"><i class="glyphicon glyphicon-pencil"></i></a></td>
        </tr>
        <tr th:if="${cheques.isEmpty()}"><td colspan="7">Nenhum cheque encontrado</td></tr>
    </tbody>
</table>
</div>
</section></body></html>
