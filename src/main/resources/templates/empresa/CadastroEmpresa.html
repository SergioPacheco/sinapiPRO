<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Empresa</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${empresa.novo}">Cadastro de Empresa</h1><h1 th:unless="${empresa.novo}" th:text="|Edição de ${empresa.nome}|">Edição</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/empresas}"><i class="glyphicon glyphicon-search"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${empresa}" th:action="${empresa.novo} ? @{/empresas/novo} : @{/empresas/{c}(c=${empresa.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-8 sn-required" sinapiPRO:classforerror="nome">
			<label class="control-label">Nome</label><input type="text" class="form-control" th:field="*{nome}" />
		</div>
		<div class="form-group col-sm-4">
			<label class="control-label">CNPJ</label><input type="text" class="form-control" th:field="*{cnpj}" />
		</div>
	</div>
	<div class="row">
		<div class="form-group col-sm-4">
			<label class="control-label">Telefone</label><input type="text" class="form-control" th:field="*{telefone}" />
		</div>
		<div class="form-group col-sm-4">
			<label class="control-label">E-mail</label><input type="email" class="form-control" th:field="*{email}" />
		</div>
		<div class="form-group col-sm-8">
			<label class="control-label">Endereço</label><input type="text" class="form-control" th:field="*{endereco}" />
		</div>
	</div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form></div>
</section></body></html>
