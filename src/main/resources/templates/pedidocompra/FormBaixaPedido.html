<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Recebimento de Pedido</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-8">
        <h1>Recebimento — Pedido #<span th:text="${pedido.numero}"></span></h1>
        <p class="text-muted" th:text="${pedido.fornecedor != null} ? 'Fornecedor: ' + ${pedido.fornecedor.nome} : ''"></p>
    </div>
    <div class="col-sm-4 text-right" style="margin-top:20px;">
        <a class="btn btn-default" th:href="@{/pedidosCompra}"><i class="glyphicon glyphicon-arrow-left"></i></a>
    </div>
</div></div></div>
<div class="container-fluid">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="alert alert-info">
        Situação atual: <strong th:text="${pedido.situacao}"></strong> |
        Valor Total: <strong th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal,1,2)}"></strong>
    </div>

    <form method="POST" th:action="@{/pedidosCompra/{c}/baixa(c=${pedido.codigo})}">
        <div class="row" style="margin-bottom:15px;">
            <div class="form-group col-sm-3">
                <label class="control-label">Data do Recebimento</label>
                <input type="date" name="dataRecebimento" class="form-control"
                       th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}"/>
            </div>
            <div class="form-group col-sm-3">
                <label class="control-label">Número da NF</label>
                <input type="text" name="numeroNF" class="form-control" placeholder="Ex: 001234"/>
            </div>
        </div>

        <table class="table table-bordered">
            <thead>
                <tr class="active">
                    <th>Item</th>
                    <th>Insumo</th>
                    <th class="text-right">Qtd Pedida</th>
                    <th class="text-right">Já Recebido</th>
                    <th class="text-right">Pendente</th>
                    <th class="text-right">Receber Agora</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${pedido.itens}">
                    <td th:text="${item.descricao}"></td>
                    <td th:text="${item.insumo != null} ? ${item.insumo.descricao} : '—'"></td>
                    <td class="text-right" th:text="${#numbers.formatDecimal(item.quantidade,1,2) + ' ' + item.unidade}"></td>
                    <td class="text-right" th:text="${#numbers.formatDecimal(item.quantidadeRecebida,1,2)}"></td>
                    <td class="text-right"
                        th:classappend="${item.quantidade.subtract(item.quantidadeRecebida).signum() > 0} ? 'text-warning' : 'text-success'"
                        th:text="${#numbers.formatDecimal(item.quantidade.subtract(item.quantidadeRecebida),1,2)}"></td>
                    <td class="text-right">
                        <input type="number" step="0.01"
                               th:name="'qtd_' + ${item.codigo}"
                               class="form-control input-sm"
                               th:value="${item.quantidade.subtract(item.quantidadeRecebida)}"
                               th:max="${item.quantidade.subtract(item.quantidadeRecebida)}"
                               min="0"
                               th:disabled="${item.quantidade.subtract(item.quantidadeRecebida).signum() == 0}"
                               style="width:100px;"/>
                    </td>
                </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-success btn-lg"
                onclick="return confirm('Confirmar recebimento e atualizar estoque?')">
            <i class="glyphicon glyphicon-ok"></i> Confirmar Recebimento
        </button>
    </form>
</div>
</section></body></html>
