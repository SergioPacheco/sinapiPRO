<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Pedido de Compra</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${pedidoCompra.novo}">Novo Pedido de Compra</h1><h1 th:unless="${pedidoCompra.novo}" th:text="|Pedido #${pedidoCompra.numero}|">Pedido</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/pedidosCompra}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${pedidoCompra}"
	  th:action="${pedidoCompra.novo} ? @{/pedidosCompra/novo} : @{/pedidosCompra/{c}(c=${pedidoCompra.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<input type="hidden" th:field="*{numero}"/>
	<div class="row">
		<div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="obra">
			<label class="control-label">Obra</label>
			<select class="form-control" th:field="*{obra}">
				<option value="">Selecione...</option>
				<option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-4">
			<label class="control-label">Fornecedor</label>
			<select class="form-control" th:field="*{fornecedor}">
				<option value="">Selecione...</option>
				<option th:each="f : ${fornecedores}" th:value="${f.codigo}" th:text="${f.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2 sn-required"><label class="control-label">Data Pedido</label><input type="date" class="form-control" th:field="*{dataPedido}"/></div>
		<div class="form-group col-sm-2"><label class="control-label">Entrega Prevista</label><input type="date" class="form-control" th:field="*{dataEntrega}"/></div>
	</div>
	<div class="row">
		<div class="form-group col-sm-2">
			<label class="control-label">Situação</label>
			<select class="form-control" th:field="*{situacao}">
				<option value="ABERTO">Aberto</option><option value="ENVIADO">Enviado</option><option value="PARCIAL">Parcial</option><option value="RECEBIDO">Recebido</option><option value="CANCELADO">Cancelado</option>
			</select>
		</div>
	</div>
	<div class="form-group"><label class="control-label">Observação</label><textarea class="form-control" rows="2" th:field="*{observacao}"></textarea></div>
	<h3>Itens</h3>
	<table class="table table-bordered table-condensed" id="tblItens">
		<thead><tr><th>Descrição</th><th>Un</th><th>Qtd</th><th>Vl. Unit.</th><th>Total</th><th>Qtd Recebida</th><th></th></tr></thead>
		<tbody>
			<tr th:each="item, stat : *{itens}">
				<input type="hidden" th:field="*{itens[__${stat.index}__].codigo}"/>
				<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].descricao}"/></td>
				<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].unidade}" style="width:60px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].quantidade}" style="width:90px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].valorUnitario}" style="width:100px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].valorTotal}" style="width:100px;" readonly/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].quantidadeRecebida}" style="width:90px;"/></td>
				<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
			</tr>
		</tbody>
	</table>
	<button type="button" class="btn btn-xs btn-default" onclick="addItemRow()">+ Item</button>
	<h3>Notas Fiscais</h3>
	<table class="table table-bordered table-condensed" id="tblNF">
		<thead><tr><th>Número</th><th>Data Emissão</th><th>Valor</th><th>Observação</th><th></th></tr></thead>
		<tbody>
			<tr th:each="nf, stat : *{notasFiscais}">
				<input type="hidden" th:field="*{notasFiscais[__${stat.index}__].codigo}"/>
				<td><input type="text" class="form-control input-sm" th:field="*{notasFiscais[__${stat.index}__].numero}"/></td>
				<td><input type="date" class="form-control input-sm" th:field="*{notasFiscais[__${stat.index}__].dataEmissao}"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{notasFiscais[__${stat.index}__].valor}" style="width:100px;"/></td>
				<td><input type="text" class="form-control input-sm" th:field="*{notasFiscais[__${stat.index}__].observacao}"/></td>
				<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
			</tr>
		</tbody>
	</table>
	<button type="button" class="btn btn-xs btn-default" onclick="addNFRow()">+ NF</button>
	<div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idxI = document.getElementById('tblItens').querySelector('tbody').rows.length;
var idxN = document.getElementById('tblNF').querySelector('tbody').rows.length;
function addItemRow() {
	var tbody = document.getElementById('tblItens').querySelector('tbody'); var row = tbody.insertRow();
	row.innerHTML = '<td><input type="text" class="form-control input-sm" name="itens['+idxI+'].descricao"/></td>' +
		'<td><input type="text" class="form-control input-sm" name="itens['+idxI+'].unidade" style="width:60px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idxI+'].quantidade" value="0" style="width:90px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idxI+'].valorUnitario" value="0" style="width:100px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idxI+'].valorTotal" value="0" style="width:100px;" readonly/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idxI+'].quantidadeRecebida" value="0" style="width:90px;"/></td>' +
		'<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>'; idxI++; }
function addNFRow() {
	var tbody = document.getElementById('tblNF').querySelector('tbody'); var row = tbody.insertRow();
	row.innerHTML = '<td><input type="text" class="form-control input-sm" name="notasFiscais['+idxN+'].numero"/></td>' +
		'<td><input type="date" class="form-control input-sm" name="notasFiscais['+idxN+'].dataEmissao"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="notasFiscais['+idxN+'].valor" value="0" style="width:100px;"/></td>' +
		'<td><input type="text" class="form-control input-sm" name="notasFiscais['+idxN+'].observacao"/></td>' +
		'<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>'; idxN++; }
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
