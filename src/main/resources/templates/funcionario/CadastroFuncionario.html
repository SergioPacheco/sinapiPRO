<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Funcionário</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${funcionario.novo}">Cadastro de Funcionário</h1><h1 th:unless="${funcionario.novo}" th:text="|Edição de ${funcionario.nome}|">Edição</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/funcionarios}"><i class="glyphicon glyphicon-search"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${funcionario}" th:action="${funcionario.novo} ? @{/funcionarios/novo} : @{/funcionarios/{c}(c=${funcionario.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-8 sn-required" sinapiPRO:classforerror="nome">
			<label class="control-label">Nome</label><input type="text" class="form-control" th:field="*{nome}" />
		</div>
		<div class="form-group col-sm-4">
			<label class="control-label">CPF</label><input type="text" class="form-control" th:field="*{cpf}" />
		</div>
	</div>
	<div class="row">
		<div class="form-group col-sm-4">
			<label class="control-label">E-mail</label><input type="email" class="form-control" th:field="*{email}" />
		</div>
		<div class="form-group col-sm-3">
			<label class="control-label">Telefone</label><input type="text" class="form-control" th:field="*{telefone}" />
		</div>
		<div class="form-group col-sm-2">
			<label class="control-label">Admissão</label><input type="date" class="form-control" th:field="*{dataAdmissao}" />
		</div>
		<div class="form-group col-sm-2">
			<label class="control-label">Demissão</label><input type="date" class="form-control" th:field="*{dataDemissao}" />
		</div>
	</div>
	<div class="row">
		<div class="form-group col-sm-4">
			<label class="control-label">Cargo</label>
			<select class="form-control" th:field="*{cargo}">
				<option value="">Selecione...</option>
				<option th:each="c : ${cargos}" th:value="${c.codigo}" th:text="${c.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-4">
			<label class="control-label">Função</label>
			<select class="form-control" th:field="*{funcao}">
				<option value="">Selecione...</option>
				<option th:each="f : ${funcoes}" th:value="${f.codigo}" th:text="${f.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-4">
			<label class="control-label">Departamento</label>
			<select class="form-control" th:field="*{departamento}">
				<option value="">Selecione...</option>
				<option th:each="d : ${departamentos}" th:value="${d.codigo}" th:text="${d.nome}"></option>
			</select>
		</div>
	</div>
	<div class="form-group">
		<label class="checkbox-inline"><input type="checkbox" th:field="*{ativo}" /> Ativo</label>
	</div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form></div>
</section></body></html>
