<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Nota Fiscal de Serviço</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10">
        <h1 th:if="${notaFiscalServico.novo}">Nova Nota Fiscal de Serviço</h1>
        <h1 th:unless="${notaFiscalServico.novo}" th:text="|NFS-e: ${notaFiscalServico.numero}|">NFS-e</h1>
    </div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/notasFiscaisServico}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${notaFiscalServico}"
      th:action="${notaFiscalServico.novo} ? @{/notasFiscaisServico/novo} : @{/notasFiscaisServico/{c}(c=${notaFiscalServico.codigo})}">
    <sinapiPRO:message/>
    <input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-2"><label class="control-label">Número</label><input type="text" class="form-control" th:field="*{numero}"/></div>
        <div class="form-group col-sm-1"><label class="control-label">Série</label><input type="text" class="form-control" th:field="*{serie}"/></div>
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="cliente">
            <label class="control-label">Cliente (Tomador)</label>
            <select class="form-control" th:field="*{cliente}">
                <option value="">Selecione...</option>
                <option th:each="c : ${clientes}" th:value="${c.codigo}" th:text="${c.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-3">
            <label class="control-label">Obra</label>
            <select class="form-control" th:field="*{obra}">
                <option value="">Nenhuma</option>
                <option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-2 sn-required">
            <label class="control-label">Data Emissão</label>
            <input type="date" class="form-control" th:field="*{dataEmissao}"/>
        </div>
    </div>
    <div class="row">
        <div class="form-group col-sm-3 sn-required">
            <label class="control-label">Valor dos Serviços (R$)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valorServicos}"
                   onchange="calcularISS()"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Alíquota ISS (%)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{aliquotaIss}"
                   onchange="calcularISS()"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Valor ISS (R$)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valorIss}" readonly/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Valor Líquido (R$)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valorLiquido}" readonly/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="EMITIDA">Emitida</option>
                <option value="CANCELADA">Cancelada</option>
                <option value="SUBSTITUIDA">Substituída</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label">Discriminação dos Serviços</label>
        <textarea class="form-control" rows="5" th:field="*{discriminacao}"
                  placeholder="Descreva os serviços prestados..."></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
<script>
function calcularISS() {
    var servicos = parseFloat(document.querySelector('[name$="valorServicos"]').value) || 0;
    var aliquota = parseFloat(document.querySelector('[name$="aliquotaIss"]').value) || 0;
    var iss = (servicos * aliquota / 100).toFixed(2);
    var liquido = (servicos - iss).toFixed(2);
    document.querySelector('[name$="valorIss"]').value = iss;
    document.querySelector('[name$="valorLiquido"]').value = liquido;
}
</script>
</section></body></html>
