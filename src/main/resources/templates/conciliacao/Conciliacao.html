<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Conciliação Bancária</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><h1>Conciliação Bancária</h1></div></div>
<div class="container-fluid">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

    <form method="GET" class="form-inline" style="margin-bottom:15px;">
        <div class="form-group">
            <label>Conta</label>
            <select name="codigoConta" class="form-control" onchange="this.form.submit()">
                <option value="">Selecione...</option>
                <option th:each="c : ${contas}" th:value="${c.codigo}" th:text="${c.banco + ' — ' + c.conta}"
                    th:selected="${codigoConta != null and codigoConta == c.codigo}"></option>
            </select>
        </div>
        <div class="form-group" style="margin-left:8px;">
            <label>De</label><input type="date" name="inicio" class="form-control" th:value="${inicio}"/>
        </div>
        <div class="form-group" style="margin-left:8px;">
            <label>Até</label><input type="date" name="fim" class="form-control" th:value="${fim}"/>
        </div>
        <div class="form-group" style="margin-left:8px;">
            <label>Saldo Extrato (R$)</label>
            <input type="number" step="0.01" name="saldoExtrato" class="form-control" th:value="${saldoExtrato}" style="width:130px;"/>
        </div>
        <button type="submit" class="btn btn-default" style="margin-left:8px;">Filtrar</button>
    </form>

    <!-- Resumo -->
    <div th:if="${resumo != null}" class="panel panel-default" style="margin-bottom:15px;">
        <div class="panel-heading"><strong>Resumo da Conciliação</strong></div>
        <div class="panel-body">
            <div class="row text-center">
                <div class="col-sm-3">
                    <div class="text-muted">Saldo Sistema</div>
                    <div class="h4" th:text="'R$ ' + ${#numbers.formatDecimal(resumo.saldoSistema,1,2)}"></div>
                </div>
                <div class="col-sm-3">
                    <div class="text-muted">Saldo Conciliado</div>
                    <div class="h4 text-info" th:text="'R$ ' + ${#numbers.formatDecimal(resumo.saldoConciliado,1,2)}"></div>
                </div>
                <div class="col-sm-3">
                    <div class="text-muted">Saldo Extrato</div>
                    <div class="h4 text-success" th:text="'R$ ' + ${#numbers.formatDecimal(resumo.saldoExtrato,1,2)}"></div>
                </div>
                <div class="col-sm-3">
                    <div class="text-muted">Diferença</div>
                    <div class="h4"
                         th:classappend="${resumo.diferenca.signum() != 0} ? 'text-danger' : 'text-success'"
                         th:text="'R$ ' + ${#numbers.formatDecimal(resumo.diferenca,1,2)}"></div>
                </div>
            </div>
            <div class="text-center text-muted" style="margin-top:8px;">
                <span th:text="${resumo.movimentosConciliados + ' conciliados / ' + resumo.movimentosPendentes + ' pendentes / ' + resumo.totalMovimentos + ' total'}"></span>
            </div>
        </div>
    </div>

    <!-- Conciliar em lote -->
    <div th:if="${codigoConta != null}" style="margin-bottom:10px;">
        <form method="POST" th:action="@{/conciliacao/lote}" style="display:inline;">
            <input type="hidden" name="codigoConta" th:value="${codigoConta}"/>
            <input type="hidden" name="inicio" th:value="${inicio}"/>
            <input type="hidden" name="fim" th:value="${fim}"/>
            <button type="submit" class="btn btn-sm btn-info"
                    onclick="return confirm('Conciliar todos os movimentos do período?')">
                <i class="glyphicon glyphicon-ok-circle"></i> Conciliar Todos do Período
            </button>
        </form>
    </div>

    <!-- Movimentos não conciliados -->
    <div th:if="${movimentos != null}">
        <h3>Movimentos Pendentes de Conciliação (<span th:text="${movimentos.size()}"></span>)</h3>
        <table class="table table-bordered table-condensed table-hover">
            <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Documento</th><th class="text-right">Valor</th><th class="text-center">Conciliar</th></tr></thead>
            <tbody>
                <tr th:each="m : ${movimentos}">
                    <td th:text="${#temporals.format(m.dataMovimento,'dd/MM/yyyy')}"></td>
                    <td><span class="label" th:classappend="${m.tipo == 'CREDITO'} ? 'label-success' : 'label-danger'" th:text="${m.tipo}"></span></td>
                    <td th:text="${m.descricao}"></td>
                    <td th:text="${m.documento}"></td>
                    <td class="text-right" th:classappend="${m.tipo == 'DEBITO'} ? 'text-danger' : 'text-success'" th:text="${#numbers.formatDecimal(m.valor,1,2)}"></td>
                    <td class="text-center">
                        <button class="btn btn-xs btn-success js-conciliar" th:data-id="${m.codigo}">
                            <i class="glyphicon glyphicon-ok"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${movimentos.isEmpty()}"><td colspan="6" class="text-success text-center"><i class="glyphicon glyphicon-ok"></i> Todos os movimentos estão conciliados!</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script>
document.querySelectorAll('.js-conciliar').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var id = this.dataset.id;
        fetch('/conciliacao/' + id + '/conciliar', {method: 'POST'})
            .then(function() { location.reload(); });
    });
});
</script>
</section></body></html>
