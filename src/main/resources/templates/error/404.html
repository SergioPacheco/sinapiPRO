<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Página não encontrada — SinapiPRO</title></head>
<body><section layout:fragment="conteudo">
<div class="container-fluid" style="margin-top:50px;text-align:center;">
    <div class="alert alert-warning" style="max-width:600px;margin:0 auto;">
        <h2><i class="glyphicon glyphicon-map-marker"></i> Página não encontrada</h2>
        <p th:text="${mensagem != null} ? ${mensagem} : 'O recurso solicitado não foi encontrado.'"></p>
        <p class="text-muted" th:if="${uri != null}" th:text="'URL: ' + ${uri}"></p>
        <a th:href="@{/}" class="btn btn-default">
            <i class="glyphicon glyphicon-home"></i> Voltar ao início
        </a>
    </div>
</div>
</section></body></html>
