<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Documento GED</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10">
        <h1 th:if="${documentoGed.novo}">Novo Documento</h1>
        <h1 th:unless="${documentoGed.novo}" th:text="|Documento: ${documentoGed.nome}|">Documento</h1>
    </div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/ged}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${documentoGed}"
      th:action="${documentoGed.novo} ? @{/ged/novo} : @{/ged/{c}(c=${documentoGed.codigo})}"
      enctype="multipart/form-data">
    <sinapiPRO:message/>
    <input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-6 sn-required" sinapiPRO:classforerror="nome">
            <label class="control-label">Nome do Documento</label>
            <input type="text" class="form-control" th:field="*{nome}"
                   placeholder="Deixe em branco para usar o nome do arquivo"/>
        </div>
        <div class="form-group col-sm-6">
            <label class="control-label">Arquivo <span class="text-muted">(PDF, imagens, Office, ZIP — máx. 50 MB)</span></label>
            <input type="file" name="arquivo" class="form-control"
                   accept=".pdf,.jpg,.jpeg,.png,.gif,.xls,.xlsx,.doc,.docx,.txt,.zip"/>
            <span th:if="${documentoGed.caminho != null}" class="help-block">
                Arquivo atual: <strong th:text="${documentoGed.caminho}"></strong>
                <a th:href="@{/ged/{c}/download(c=${documentoGed.codigo})}" class="btn btn-xs btn-default">
                    <i class="glyphicon glyphicon-download"></i> Baixar
                </a>
            </span>
        </div>
    </div>
    <div class="row">
        <div class="form-group col-sm-4">
            <label class="control-label">Obra</label>
            <select class="form-control" th:field="*{obra}">
                <option value="">Nenhuma</option>
                <option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-4">
            <label class="control-label">Cliente</label>
            <select class="form-control" th:field="*{cliente}">
                <option value="">Nenhum</option>
                <option th:each="c : ${clientes}" th:value="${c.codigo}" th:text="${c.nome}"></option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label">Descrição</label>
        <input type="text" class="form-control" th:field="*{descricao}"/>
    </div>
    <div class="form-group">
        <label class="control-label">Caminho / URL do Arquivo</label>
        <input type="text" class="form-control" th:field="*{caminho}"
               placeholder="Ex: /documentos/obra1/contrato.pdf"/>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
