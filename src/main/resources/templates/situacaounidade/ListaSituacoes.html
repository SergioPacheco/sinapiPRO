<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Situações de Unidade</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-xs-10"><h1>Situações de Unidade</h1></div>
    <div class="col-xs-2"><a class="btn btn-default" th:href="@{/situacoesUnidade/novo}"><i class="glyphicon glyphicon-plus-sign"></i></a></div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
    <thead><tr><th>Nome</th><th>Cor</th><th class="table-col-acoes"></th></tr></thead>
    <tbody>
        <tr th:each="s : ${situacoes}">
            <td th:text="${s.nome}"></td>
            <td><span th:if="${s.cor != null}" class="label" th:style="'background-color:' + ${s.cor}" th:text="${s.cor}"></span></td>
            <td class="text-center"><a class="btn btn-link btn-xs" th:href="@{/situacoesUnidade/{c}(c=${s.codigo})}"><i class="glyphicon glyphicon-pencil"></i></a></td>
        </tr>
        <tr th:if="${situacoes.isEmpty()}"><td colspan="3">Nenhuma situação cadastrada</td></tr>
    </tbody>
</table>
</div>
</section></body></html>
