<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Situação de Unidade</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10"><h1 th:if="${situacaoUnidade.novo}">Nova Situação</h1><h1 th:unless="${situacaoUnidade.novo}" th:text="|Edição: ${situacaoUnidade.nome}|">Situação</h1></div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/situacoesUnidade}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${situacaoUnidade}"
      th:action="${situacaoUnidade.novo} ? @{/situacoesUnidade/novo} : @{/situacoesUnidade/{c}(c=${situacaoUnidade.codigo})}">
    <sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-6 sn-required"><label class="control-label">Nome</label><input type="text" class="form-control" th:field="*{nome}"/></div>
        <div class="form-group col-sm-3"><label class="control-label">Cor (hex)</label><input type="color" class="form-control" th:field="*{cor}"/></div>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
