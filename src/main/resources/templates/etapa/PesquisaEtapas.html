<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:brewer="http://sinapiPRO.ifrn.edu.br"
	xmlns:data="http://www.thymeleaf.org/extras/data"
	layout:decorate="~{layout/LayoutPadrao}">
	
<head>
	<title>Pesquisa de Etapas do Orçamento</title>
</head>

<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-10">
					<h1>Pesquisa de Etapas</h1>
				</div>
				<div class="col-sm-2">
					<div class="aw-page-header-controls">
						<a class="btn  btn-default" th:href="@{/etapas/nova}">
							<i class="glyphicon  glyphicon-plus-sign"></i> 
							<span class="hidden-xs  hidden-sm">Nova Etapa</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="container-fluid">
		<form method="GET" th:object="${etapaFilter}">
			<div class="row">
				<div class="form-group  col-sm-12">
					<label class="control-label" for="nome">Etapa</label>
					<input type="text" class="form-control" id="nome" autofocus="autofocus" th:field="*{nome}">
				</div>
			</div>
			<button type="submit" class="btn btn-primary">Pesquisar</button>
		</form>
		<div class="table-responsive  bw-tabela-simples">
			<table class="table  table-hover">
				<thead>
					<tr>
						<th class="table-etapas-col-codigo">Código</th>
						<th> <sinapiPRO:order page="${pagina}" field="nome" text="Nome"/> </th>
						<th class="table-col-acoes"></th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="etapa : ${pagina.conteudo}">
						<td class="text-left" th:text="${etapa.codigo}">001</td>
						<td th:text="${etapa.nome}">Serviços Preliminares</td>
						<td class="text-center">
							<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" 
							   th:href="@{/etapas/{codigo}(codigo=${etapa.codigo})}"> 
							   <i class="glyphicon glyphicon-pencil"></i>
							</a>
							<a class="btn  btn-link  btn-xs  js-tooltip  js-exclusao-btn" title="Excluir" 
							   href="#" data:url="@{/etapas/{codigo}(codigo=${etapa.codigo})}"
							   data:objeto="${etapa.nome}"> <i class="glyphicon glyphicon-remove"></i>
							</a>
						</td>
					</tr>
					<tr th:if="${pagina.vazia}">
						<td colspan="3" >Nenhuma etapa encontrado</td>
					</tr>
				</tbody>
			</table>
		</div>
		<sinapiPRO:pagination page="${pagina}"/>
	</div>
</section>
</body>
</html>
