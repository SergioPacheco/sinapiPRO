<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
	
<div th:fragment="pesquisaRapidaEtapas" 
     class="modal fade" 
     id="pesquisaRapidaEtapas" 
     tabindex="-1" 
     role="dialog"
     aria-labelledby="exampleModalLabel" aria-hidden="true">
 	<div class="modal-dialog">
   		<div class="modal-content">
   			<div class="modal-header">
       			<button type="button" class="close" 
       			        data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        		<h4 class="modal-title">Pesquisa de Etapas</h4>
      		</div>
   			<div class="modal-body">
                <div class="alert  alert-danger  hidden  js-mensagem-cadastro-rapido-etapa" role="alert">
                </div>   			
   				<div class="alert  alert-danger  alert-dismissible  hidden  js-mensagem-erro" role="alert">
					<button type="button" 
				            class="close js-etapa-input" 
					         data-dismiss="alert">
						<span aria-hidden="true">&times;</span>
					</button>
					<div><i class="fa  fa-exclamation-circle"></i>Informe pelo menos 3 letras na pesquisa</div>
				</div>
   				<form>
	   				<div class="form-group">
           				<label for="etapa" class="col-form-label">Nome Etapa:</label>
						<input id="etapa" type="text" class="form-control  js-etapa-input" 
							   placeholder="Pesquise e adicione a etapa pelo Nome" 
							   data:url="@{/etapas}"/>
					</div>	 
				</form>
			</div>
			<div class="modal-footer">		
			     <button type="button" class="btn btn-danger" data-dismiss="modal">Cancelar</button>
		    </div>
     		 
   		</div>
 	</div>
</div>
</html>
