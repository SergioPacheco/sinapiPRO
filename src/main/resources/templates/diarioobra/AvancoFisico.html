<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Avanço Físico</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-8">
        <h1>Avanço Físico — <small th:text="${obra != null} ? ${obra.nome} : ''"></small></h1>
    </div>
    <div class="col-sm-4 text-right" style="margin-top:20px;">
        <a class="btn btn-default" th:href="@{/diarioObra}"><i class="glyphicon glyphicon-arrow-left"></i></a>
    </div>
</div></div></div>
<div class="container-fluid">
    <form method="GET" class="form-inline" style="margin-bottom:15px;">
        <div class="form-group">
            <label>De</label><input type="date" name="inicio" class="form-control" th:value="${inicio}"/>
        </div>
        <div class="form-group" style="margin-left:8px;">
            <label>Até</label><input type="date" name="fim" class="form-control" th:value="${fim}"/>
        </div>
        <button type="submit" class="btn btn-default" style="margin-left:8px;">Filtrar</button>
    </form>

    <!-- Avanço Geral -->
    <div class="panel panel-primary" style="margin-bottom:20px;">
        <div class="panel-heading"><strong>Avanço Geral da Obra</strong></div>
        <div class="panel-body">
            <div class="progress" style="height:30px;margin-bottom:5px;">
                <div class="progress-bar progress-bar-success" role="progressbar"
                     th:style="|width:${avancoGeral}%|"
                     th:text="${#numbers.formatDecimal(avancoGeral,1,1) + '%'}">
                </div>
            </div>
            <p class="text-center text-muted" th:text="${#numbers.formatDecimal(avancoGeral,1,2) + '% executado (média dos serviços)'}"></p>
        </div>
    </div>

    <!-- Avanço por Serviço -->
    <h3>Avanço por Serviço</h3>
    <table class="table table-bordered table-condensed">
        <thead>
            <tr class="active">
                <th>Serviço</th>
                <th>Unidade</th>
                <th class="text-right">Qtd Total</th>
                <th style="width:200px;">% Executado</th>
                <th class="text-right">%</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${servicos}">
                <td th:text="${s.descricao}"></td>
                <td th:text="${s.unidade}"></td>
                <td class="text-right" th:text="${#numbers.formatDecimal(s.quantidadeTotal,1,2)}"></td>
                <td>
                    <div class="progress" style="margin:0;height:18px;">
                        <div class="progress-bar"
                             th:classappend="${s.percentualAcumulado.compareTo(T(java.math.BigDecimal).valueOf(100)) >= 0} ? 'progress-bar-success' : 'progress-bar-info'"
                             role="progressbar"
                             th:style="|width:${s.percentualAcumulado}%|">
                        </div>
                    </div>
                </td>
                <td class="text-right"
                    th:classappend="${s.percentualAcumulado.compareTo(T(java.math.BigDecimal).valueOf(100)) >= 0} ? 'text-success' : ''"
                    th:text="${#numbers.formatDecimal(s.percentualAcumulado,1,1) + '%'}"></td>
            </tr>
            <tr th:if="${servicos.isEmpty()}">
                <td colspan="5" class="text-muted text-center">Nenhum serviço registrado no período</td>
            </tr>
        </tbody>
    </table>

    <!-- Curva de Avanço -->
    <div th:unless="${curva.isEmpty()}" style="margin-top:20px;">
        <h3>Curva de Avanço</h3>
        <table class="table table-condensed table-bordered">
            <thead><tr><th>Data</th><th>% Acumulado</th><th style="width:300px;">Progresso</th></tr></thead>
            <tbody>
                <tr th:each="p : ${curva}">
                    <td th:text="${#temporals.format(p.data,'dd/MM/yyyy')}"></td>
                    <td th:text="${#numbers.formatDecimal(p.percentual,1,1) + '%'}"></td>
                    <td>
                        <div class="progress" style="margin:0;height:16px;">
                            <div class="progress-bar progress-bar-info" role="progressbar"
                                 th:style="|width:${p.percentual}%|"></div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</section></body></html>
