<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sinapiPRO="http://sinapiPRO.ifrn.edu.br"
	xmlns:data="http://www.thymeleaf.org/extras/data"
	layout:decorate="~{layout/LayoutPadrao}">
	
<head>
	<title>Pesquisa de Imóveis</title>
</head>

<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-10">
					<h1>Pesquisa de Imóveis</h1>
				</div>
				<div class="col-sm-2">
					<div class="aw-page-header-controls">
						<a class="btn  btn-default" th:href="@{/imoveis/novo}">
							<i class="glyphicon  glyphicon-plus-sign"></i> 
							<span class="hidden-xs  hidden-sm">Novo Imóvel</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="container-fluid">
		<form method="GET" th:object="${imovelFilter}">
			<div class="row">
				
				<div class="form-group  col-sm-12">
					<label class="control-label" for="descricao">Descricao</label>
					<input type="text" class="form-control" id="descricao" autofocus="autofocus" th:field="*{descricao}">
				</div>
				
			</div>
			
			<div class="row">
				<div class="form-group  col-sm-3">
					<label class="control-label" for="descricao">Estado</label>
					<input type="text" class="form-control" id="estado" th:field="*{estado}">
				</div>
				<div class="form-group  col-sm-3">
					<label class="control-label" for="cidade">Cidade</label>
					<input type="text" class="form-control" id="cidade" th:field="*{cidade}">
				</div>
				<div class="form-group  col-sm-3">
					<label class="control-label" for="precoMin">Preço Minimo</label>
					<input type="text" class="form-control" id="precoMin" th:field="*{precoMin}">
				</div>
				<div class="form-group  col-sm-3">
					<label class="control-label" for="precoMax">Preço Máximo</label>
					<input type="text" class="form-control" id="precoMax" th:field="*{precoMax}">
				</div>
			
			</div>
			
			<button type="submit" class="btn btn-primary">Pesquisar</button>
			
		</form>
		<div class="table-responsive  sn-tabela-simples">
			<table class="table  table-hover">
				<thead>
					<tr>
						<th class="table-etapas-col-codigo">Código</th>
						
						
						<th> <sinapiPRO:order page="${pagina}" field="nome" text="Nome"/> </th>
						<th class="table-col-acoes"></th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="etapa : ${pagina.conteudo}">
						<td class="text-left" th:text="${imovel.codigo}">001</td>
						
						<td th:text="${etapa.nome}">Casa 3 Quartos </td>
						
						<td class="text-center">
							<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" 
							   th:href="@{/imoveis/{codigo}(codigo=${imovel.codigo})}"> 
							   <i class="glyphicon glyphicon-pencil"></i>
							</a>
							<a class="btn  btn-link  btn-xs  js-tooltip  js-exclusao-btn" title="Excluir" 
							   href="#" data:url="@{/imoveis/{codigo}(codigo=${imovel.codigo})}"
							   data:objeto="${imovel.descricao}"> <i class="glyphicon glyphicon-remove"></i>
							</a>
						</td>
					</tr>
					<tr th:if="${pagina.vazia}">
						<td colspan="3" >Nenhuma imóvel encontrado</td>
					</tr>
				</tbody>
			</table>
		</div>
		<sinapiPRO:pagination page="${pagina}"/>
	</div>
</section>
</body>
</html>
