<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Novo Movimento Bancário</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1>Novo Movimento Bancário</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/movimentosBancarios}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${movimentoBancario}" th:action="@{/movimentosBancarios/novo}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="contaBancaria">
			<label class="control-label">Conta Bancária</label>
			<select class="form-control" th:field="*{contaBancaria}">
				<option value="">Selecione...</option>
				<option th:each="c : ${contas}" th:value="${c.codigo}" th:text="${c.banco + ' - ' + c.conta}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2 sn-required" sinapiPRO:classforerror="tipo">
			<label class="control-label">Tipo</label>
			<select class="form-control" th:field="*{tipo}">
				<option value="">Selecione...</option>
				<option value="CREDITO">Crédito</option>
				<option value="DEBITO">Débito</option>
			</select>
		</div>
		<div class="form-group col-sm-2 sn-required"><label class="control-label">Valor</label><input type="number" step="0.01" class="form-control" th:field="*{valor}"/></div>
		<div class="form-group col-sm-2 sn-required"><label class="control-label">Data</label><input type="date" class="form-control" th:field="*{dataMovimento}"/></div>
	</div>
	<div class="row">
		<div class="form-group col-sm-4">
			<label class="control-label">Histórico</label>
			<select class="form-control" th:field="*{historico}">
				<option value="">Selecione...</option>
				<option th:each="h : ${historicos}" th:value="${h.codigo}" th:text="${h.descricao}"></option>
			</select>
		</div>
		<div class="form-group col-sm-3"><label class="control-label">Documento</label><input type="text" class="form-control" th:field="*{documento}"/></div>
		<div class="form-group col-sm-5"><label class="control-label">Descrição</label><input type="text" class="form-control" th:field="*{descricao}"/></div>
	</div>
	<div class="form-group"><label class="checkbox-inline"><input type="checkbox" th:field="*{conciliado}"/> Conciliado</label></div>
	<button class="btn btn-primary" type="submit">Registrar</button>
</form>
</div>
</section></body></html>
