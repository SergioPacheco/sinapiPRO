<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Movimento Bancário</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-8"><h1>Movimento Bancário</h1></div>
	<div class="col-sm-4 text-right" style="margin-top:20px;">
		<a class="btn btn-success" th:href="@{/movimentosBancarios/novo}"><i class="glyphicon glyphicon-plus"></i> Novo</a>
	</div>
</div></div></div>
<div class="container-fluid">
	<form method="GET" class="form-inline" style="margin-bottom:15px;">
		<div class="form-group">
			<label>Conta</label>
			<select name="codigoConta" class="form-control" onchange="this.form.submit()">
				<option value="">Selecione...</option>
				<option th:each="c : ${contas}" th:value="${c.codigo}" th:text="${c.banco + ' - ' + c.conta}"
					th:selected="${codigoConta != null and codigoConta == c.codigo}"></option>
			</select>
		</div>
		<div class="form-group" style="margin-left:8px;">
			<label>De</label><input type="date" name="inicio" class="form-control" th:value="${inicio}"/>
		</div>
		<div class="form-group" style="margin-left:8px;">
			<label>Até</label><input type="date" name="fim" class="form-control" th:value="${fim}"/>
		</div>
		<button type="submit" class="btn btn-default" style="margin-left:8px;">Filtrar</button>
	</form>
	<div th:if="${contaSelecionada != null}" class="alert alert-info">
		Saldo Atual: <strong th:text="${#numbers.formatDecimal(contaSelecionada.saldoAtual,1,2)}"></strong>
	</div>
	<div th:if="${movimentos != null}">
		<table class="table table-hover table-bordered table-condensed">
			<thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Documento</th><th class="text-right">Valor</th><th class="text-right">Saldo Após</th><th>Conc.</th><th class="table-col-acoes"></th></tr></thead>
			<tbody>
				<tr th:each="m : ${movimentos}">
					<td th:text="${#temporals.format(m.dataMovimento,'dd/MM/yyyy')}"></td>
					<td><span class="label" th:classappend="${m.tipo == 'CREDITO'} ? 'label-success' : 'label-danger'" th:text="${m.tipo}"></span></td>
					<td th:text="${m.descricao}"></td>
					<td th:text="${m.documento}"></td>
					<td class="text-right" th:classappend="${m.tipo == 'DEBITO'} ? 'text-danger' : 'text-success'" th:text="${#numbers.formatDecimal(m.valor,1,2)}"></td>
					<td class="text-right" th:text="${m.saldoApos != null} ? ${#numbers.formatDecimal(m.saldoApos,1,2)} : ''"></td>
					<td><span th:if="${m.conciliado}" class="glyphicon glyphicon-ok text-success"></span></td>
					<td class="text-center">
						<button class="btn btn-link btn-xs js-excluir" th:data-codigo="${m.codigo}"><i class="glyphicon glyphicon-trash"></i></button>
					</td>
				</tr>
				<tr th:if="${movimentos.isEmpty()}"><td colspan="8">Nenhum movimento encontrado</td></tr>
			</tbody>
		</table>
	</div>
</div>
</section></body></html>
