<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Novo Item de Estoque</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><h1>Novo Item de Estoque</h1></div></div>
<div class="container-fluid">
<form method="POST" th:object="${estoque}" th:action="@{/estoque/novo}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="obra">
			<label class="control-label">Obra</label>
			<select class="form-control" th:field="*{obra}">
				<option value="">Selecione...</option>
				<option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="insumo">
			<label class="control-label">Insumo</label>
			<select class="form-control" th:field="*{insumo}">
				<option value="">Selecione...</option>
				<option th:each="i : ${insumos}" th:value="${i.codigo}" th:text="${i.descricao}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2"><label class="control-label">Qtd Atual</label><input type="number" step="0.01" class="form-control" th:field="*{quantidadeAtual}"/></div>
		<div class="form-group col-sm-2"><label class="control-label">Qtd Mínima</label><input type="number" step="0.01" class="form-control" th:field="*{quantidadeMinima}"/></div>
	</div>
	<div class="form-group col-sm-4"><label class="control-label">Localização</label><input type="text" class="form-control" th:field="*{localizacao}"/></div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
