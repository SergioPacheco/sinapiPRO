<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Movimentos de Estoque</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-8"><h1>Estoque: <small th:text="${estoque.insumo.descricao}"></small></h1></div>
	<div class="col-sm-4 text-right" style="margin-top:20px;">
		<a class="btn btn-default" th:href="@{/estoque?codigoObra=__${estoque.obra.codigo}__}"><i class="glyphicon glyphicon-arrow-left"></i></a>
	</div>
</div></div></div>
<div class="container-fluid">
	<div class="alert alert-info">
		Quantidade Atual: <strong th:text="${#numbers.formatDecimal(estoque.quantidadeAtual,1,2)}"></strong> |
		Mínima: <strong th:text="${#numbers.formatDecimal(estoque.quantidadeMinima,1,2)}"></strong> |
		Localização: <strong th:text="${estoque.localizacao}"></strong>
	</div>
	<h3>Registrar Movimento</h3>
	<form method="POST" th:object="${novoMovimento}" th:action="@{/estoque/{c}/movimentar(c=${estoque.codigo})}" class="form-inline">
		<div class="form-group">
			<label>Tipo</label>
			<select class="form-control" th:field="*{tipo}">
				<option value="ENTRADA">Entrada</option><option value="SAIDA">Saída</option><option value="AJUSTE">Ajuste</option>
			</select>
		</div>
		<div class="form-group" style="margin-left:8px;">
			<label>Quantidade</label><input type="number" step="0.01" class="form-control" th:field="*{quantidade}" required/>
		</div>
		<div class="form-group" style="margin-left:8px;">
			<label>Data</label><input type="date" class="form-control" th:field="*{dataMovimento}" required/>
		</div>
		<div class="form-group" style="margin-left:8px;">
			<label>Documento</label><input type="text" class="form-control" th:field="*{documento}"/>
		</div>
		<button type="submit" class="btn btn-primary" style="margin-left:8px;">Registrar</button>
	</form>
	<h3>Histórico</h3>
	<table class="table table-bordered table-condensed">
		<thead><tr><th>Data</th><th>Tipo</th><th class="text-right">Quantidade</th><th>Documento</th><th>Observação</th></tr></thead>
		<tbody>
			<tr th:each="m : ${estoque.movimentos}">
				<td th:text="${#temporals.format(m.dataMovimento,'dd/MM/yyyy')}"></td>
				<td><span class="label" th:classappend="${m.tipo == 'ENTRADA'} ? 'label-success' : (${m.tipo == 'SAIDA'} ? 'label-danger' : 'label-info')" th:text="${m.tipo}"></span></td>
				<td class="text-right" th:text="${#numbers.formatDecimal(m.quantidade,1,2)}"></td>
				<td th:text="${m.documento}"></td>
				<td th:text="${m.observacao}"></td>
			</tr>
			<tr th:if="${estoque.movimentos.isEmpty()}"><td colspan="5">Nenhum movimento registrado</td></tr>
		</tbody>
	</table>
</div>
</section></body></html>
