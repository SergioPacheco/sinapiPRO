<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Boleto</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10"><h1 th:if="${boleto.novo}">Novo Boleto</h1><h1 th:unless="${boleto.novo}" th:text="|Boleto: ${boleto.nossoNumero}|">Boleto</h1></div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/boletos}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${boleto}"
      th:action="${boleto.novo} ? @{/boletos/novo} : @{/boletos/{c}(c=${boleto.codigo})}">
    <sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-4">
            <label class="control-label">Receita Vinculada</label>
            <select class="form-control" th:field="*{receita}">
                <option value="">Nenhuma</option>
                <option th:each="r : ${receitas}" th:value="${r.codigo}" th:text="${r.descricao}"></option>
            </select>
        </div>
        <div class="form-group col-sm-3"><label class="control-label">Banco</label><input type="text" class="form-control" th:field="*{banco}"/></div>
        <div class="form-group col-sm-2"><label class="control-label">Nosso Número</label><input type="text" class="form-control" th:field="*{nossoNumero}"/></div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Valor</label><input type="number" step="0.01" class="form-control" th:field="*{valor}"/></div>
    </div>
    <div class="row">
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Emissão</label><input type="date" class="form-control" th:field="*{dataEmissao}"/></div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Vencimento</label><input type="date" class="form-control" th:field="*{dataVencimento}"/></div>
        <div class="form-group col-sm-2">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="EMITIDO">Emitido</option><option value="PAGO">Pago</option><option value="CANCELADO">Cancelado</option>
            </select>
        </div>
        <div class="form-group col-sm-6"><label class="control-label">Linha Digitável</label><input type="text" class="form-control" th:field="*{linhaDigitavel}"/></div>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
