<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Despesa</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${despesa.novo}">Nova Despesa</h1><h1 th:unless="${despesa.novo}" th:text="|Despesa: ${despesa.descricao}|">Despesa</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/despesas}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${despesa}" th:action="${despesa.novo} ? @{/despesas/novo} : @{/despesas/{c}(c=${despesa.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-6 sn-required"><label class="control-label">Descrição</label><input type="text" class="form-control" th:field="*{descricao}"/></div>
		<div class="form-group col-sm-3 sn-required"><label class="control-label">Valor</label><input type="number" step="0.01" class="form-control" th:field="*{valor}"/></div>
		<div class="form-group col-sm-3 sn-required"><label class="control-label">Vencimento</label><input type="date" class="form-control" th:field="*{dataVencimento}"/></div>
	</div>
	<div class="row">
		<div class="form-group col-sm-3">
			<label class="control-label">Obra</label>
			<select class="form-control" th:field="*{obra}">
				<option value="">Nenhuma</option>
				<option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-3">
			<label class="control-label">Fornecedor</label>
			<select class="form-control" th:field="*{fornecedor}">
				<option value="">Nenhum</option>
				<option th:each="f : ${fornecedores}" th:value="${f.codigo}" th:text="${f.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-3">
			<label class="control-label">Plano de Contas</label>
			<select class="form-control" th:field="*{planoContas}">
				<option value="">Selecione...</option>
				<option th:each="p : ${planoContas}" th:value="${p.codigo}" th:text="${p.numero + ' - ' + p.descricao}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2"><label class="control-label">Competência</label><input type="date" class="form-control" th:field="*{dataCompetencia}"/></div>
	</div>
	<div class="row">
		<div class="form-group col-sm-2">
			<label class="control-label">Situação</label>
			<select class="form-control" th:field="*{situacao}">
				<option value="ABERTA">Aberta</option><option value="PARCIAL">Parcial</option><option value="PAGA">Paga</option><option value="CANCELADA">Cancelada</option>
			</select>
		</div>
	</div>
	<div class="form-group"><label class="control-label">Observação</label><textarea class="form-control" rows="2" th:field="*{observacao}"></textarea></div>
	<h3>Pagamentos</h3>
	<table class="table table-bordered table-condensed" id="tblPag">
		<thead><tr><th>Conta Bancária</th><th>Valor Pago</th><th>Data Pagamento</th><th>Observação</th><th></th></tr></thead>
		<tbody>
			<tr th:each="p, stat : *{pagamentos}">
				<input type="hidden" th:field="*{pagamentos[__${stat.index}__].codigo}"/>
				<td>
					<select class="form-control input-sm" th:field="*{pagamentos[__${stat.index}__].contaBancaria}">
						<option value="">Nenhuma</option>
						<option th:each="cb : ${contasBancarias}" th:value="${cb.codigo}" th:text="${cb.banco + ' - ' + cb.conta}"></option>
					</select>
				</td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{pagamentos[__${stat.index}__].valorPago}" style="width:100px;"/></td>
				<td><input type="date" class="form-control input-sm" th:field="*{pagamentos[__${stat.index}__].dataPagamento}"/></td>
				<td><input type="text" class="form-control input-sm" th:field="*{pagamentos[__${stat.index}__].observacao}"/></td>
				<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
			</tr>
		</tbody>
	</table>
	<button type="button" class="btn btn-xs btn-default" onclick="addPagRow()">+ Pagamento</button>
	<div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idx = document.getElementById('tblPag').querySelector('tbody').rows.length;
function addPagRow() {
	var tbody = document.getElementById('tblPag').querySelector('tbody'); var row = tbody.insertRow();
	row.innerHTML = '<td><select class="form-control input-sm" name="pagamentos['+idx+'].contaBancaria"><option value="">Nenhuma</option></select></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="pagamentos['+idx+'].valorPago" value="0" style="width:100px;"/></td>' +
		'<td><input type="date" class="form-control input-sm" name="pagamentos['+idx+'].dataPagamento"/></td>' +
		'<td><input type="text" class="form-control input-sm" name="pagamentos['+idx+'].observacao"/></td>' +
		'<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>'; idx++; }
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
