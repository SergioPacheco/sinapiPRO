<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Unidade de Medida</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header"><div class="container-fluid"><div class="row">
		<div class="col-sm-10">
			<h1 th:if="${unidadeMedida.novo}">Cadastro de Unidade de Medida</h1>
			<h1 th:unless="${unidadeMedida.novo}" th:text="|Edição de ${unidadeMedida.nome}|">Edição</h1>
		</div>
		<div class="col-sm-2"><div class="aw-page-header-controls">
			<a class="btn btn-default" th:href="@{/unidadesMedida}"><i class="glyphicon glyphicon-search"></i></a>
		</div></div>
	</div></div></div>
	<div class="container-fluid">
		<form method="POST" th:object="${unidadeMedida}" class="form-vertical"
			th:action="${unidadeMedida.novo} ? @{/unidadesMedida/novo} : @{/unidadesMedida/{c}(c=${unidadeMedida.codigo})}">
			<sinapiPRO:message/>
			<input type="hidden" th:field="*{codigo}"/>
			<div class="row">
				<div class="form-group col-sm-8 sn-required" sinapiPRO:classforerror="nome">
					<label class="control-label">Nome</label>
					<input type="text" class="form-control" th:field="*{nome}" />
				</div>
				<div class="form-group col-sm-2 sn-required" sinapiPRO:classforerror="sigla">
					<label class="control-label">Sigla</label>
					<input type="text" class="form-control text-uppercase" th:field="*{sigla}" />
				</div>
			</div>
			<button class="btn btn-primary" type="submit">Salvar</button>
		</form>
	</div>
</section>
</body>
</html>
