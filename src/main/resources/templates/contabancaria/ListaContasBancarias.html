<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Contas Bancárias</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-xs-10"><h1>Contas Bancárias</h1></div>
	<div class="col-xs-2"><a class="btn btn-default" th:href="@{/contasBancarias/novo}"><i class="glyphicon glyphicon-plus-sign"></i></a></div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
	<thead><tr><th>Banco</th><th>Agência</th><th>Conta</th><th>Descrição</th><th class="text-right">Saldo Atual</th><th>Ativa</th><th class="table-col-acoes"></th></tr></thead>
	<tbody>
		<tr th:each="c : ${contas}">
			<td th:text="${c.banco}"></td><td th:text="${c.agencia}"></td><td th:text="${c.conta}"></td><td th:text="${c.descricao}"></td>
			<td class="text-right" th:classappend="${c.saldoAtual.signum() < 0} ? 'text-danger' : ''" th:text="${#numbers.formatDecimal(c.saldoAtual,1,2)}"></td>
			<td><span th:if="${c.ativa}" class="label label-success">Sim</span><span th:unless="${c.ativa}" class="label label-default">Não</span></td>
			<td class="text-center"><a class="btn btn-link btn-xs" th:href="@{/contasBancarias/{c}(c=${c.codigo})}"><i class="glyphicon glyphicon-pencil"></i></a></td>
		</tr>
		<tr th:if="${contas.isEmpty()}"><td colspan="7">Nenhuma conta bancária cadastrada</td></tr>
	</tbody>
</table>
</div>
</section></body></html>
