<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Tipo de Obra</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${tipoObra.novo}">Cadastro de Tipo de Obra</h1><h1 th:unless="${tipoObra.novo}" th:text="|Edição de ${tipoObra.nome}|">Edição</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/tiposObra}"><i class="glyphicon glyphicon-search"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${tipoObra}" th:action="${tipoObra.novo} ? @{/tiposObra/novo} : @{/tiposObra/{c}(c=${tipoObra.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="form-group col-sm-8 sn-required" sinapiPRO:classforerror="nome">
		<label class="control-label">Nome</label><input type="text" class="form-control" th:field="*{nome}" />
	</div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form></div>
</section></body></html>
