<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Análise de Cotação</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-8">
        <h1>Análise de Cotação <small th:text="|#${cotacao.numero} — ${cotacao.obra.nome}|"></small></h1>
    </div>
    <div class="col-sm-4 text-right" style="margin-top:20px;">
        <a class="btn btn-default" th:href="@{/cotacoes}"><i class="glyphicon glyphicon-arrow-left"></i></a>
        <form method="POST" th:action="@{/cotacoes/{c}/analise/selecionarMenorPreco(c=${cotacao.codigo})}" style="display:inline;">
            <button type="submit" class="btn btn-info">
                <i class="glyphicon glyphicon-flash"></i> Auto: Menor Preço
            </button>
        </form>
        <form method="POST" th:action="@{/cotacoes/{c}/analise/gerarPedidos(c=${cotacao.codigo})}" style="display:inline;">
            <button type="submit" class="btn btn-success"
                    onclick="return confirm('Gerar pedidos de compra com os itens selecionados?')">
                <i class="glyphicon glyphicon-shopping-cart"></i> Gerar Pedidos
            </button>
        </form>
    </div>
</div></div></div>
<div class="container-fluid">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <!-- Totais por Fornecedor -->
    <div class="panel panel-default" style="margin-bottom:20px;">
        <div class="panel-heading"><strong>Resumo por Fornecedor</strong></div>
        <div class="panel-body">
            <table class="table table-condensed table-bordered">
                <thead><tr><th>Fornecedor</th><th class="text-center">Itens Respondidos</th><th class="text-right">Total (R$)</th></tr></thead>
                <tbody>
                    <tr th:each="tf : ${totaisFornecedor}">
                        <td th:text="${tf.cotacaoFornecedor.fornecedor.nome}"></td>
                        <td class="text-center" th:text="${tf.itensRespondidos}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(tf.total,1,2)}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Análise por Item -->
    <h3>Comparativo de Preços por Item</h3>
    <div th:each="ia : ${analise}" class="panel panel-default" style="margin-bottom:10px;">
        <div class="panel-heading">
            <strong th:text="${ia.item.descricao}"></strong>
            <span class="text-muted" th:text="| — ${ia.item.quantidade} ${ia.item.unidade}|"></span>
            <span th:if="${ia.menorPreco != null}" class="pull-right">
                Menor preço: <strong class="text-success" th:text="'R$ ' + ${#numbers.formatDecimal(ia.menorPreco,1,2)}"></strong>
                <span th:text="| (${ia.fornecedorMenorPreco})|"></span>
                <span th:if="${ia.economia.signum() > 0}" class="text-danger"
                      th:text="| — Economia potencial: R$ ${#numbers.formatDecimal(ia.economia,1,2)}|"></span>
            </span>
        </div>
        <div class="panel-body" style="padding:5px;">
            <table class="table table-condensed table-hover" style="margin:0;">
                <thead>
                    <tr>
                        <th>Fornecedor</th>
                        <th class="text-right">Vl. Unitário</th>
                        <th class="text-right">Total</th>
                        <th class="text-center">Prazo (dias)</th>
                        <th class="text-center">Selecionado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r, stat : ${ia.respostas}"
                        th:classappend="${stat.index == 0} ? 'success' : ''">
                        <td>
                            <span th:if="${stat.index == 0}" class="label label-success">Menor</span>
                            <span th:text="${r.cotacaoFornecedor.fornecedor.nome}"></span>
                        </td>
                        <td class="text-right" th:text="'R$ ' + ${#numbers.formatDecimal(r.valorUnitario,1,4)}"></td>
                        <td class="text-right"
                            th:text="'R$ ' + ${#numbers.formatDecimal(r.valorUnitario.multiply(ia.item.quantidade),1,2)}"></td>
                        <td class="text-center" th:text="${r.prazoEntrega != null} ? ${r.prazoEntrega + ' dias'} : '—'"></td>
                        <td class="text-center">
                            <span th:if="${r.selecionado}" class="glyphicon glyphicon-ok text-success"></span>
                            <span th:unless="${r.selecionado}" class="glyphicon glyphicon-remove text-muted"></span>
                        </td>
                    </tr>
                    <tr th:if="${ia.respostas.isEmpty()}">
                        <td colspan="5" class="text-muted text-center">Nenhuma resposta recebida para este item</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</section></body></html>
