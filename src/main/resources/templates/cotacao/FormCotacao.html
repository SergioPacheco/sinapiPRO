<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cotação</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${cotacao.novo}">Nova Cotação</h1><h1 th:unless="${cotacao.novo}" th:text="|Cotação #${cotacao.numero}|">Cotação</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/cotacoes}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${cotacao}"
	  th:action="${cotacao.novo} ? @{/cotacoes/novo} : @{/cotacoes/{c}(c=${cotacao.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<input type="hidden" th:field="*{numero}"/>
	<div class="row">
		<div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="obra">
			<label class="control-label">Obra</label>
			<select class="form-control" th:field="*{obra}">
				<option value="">Selecione...</option>
				<option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2 sn-required"><label class="control-label">Data</label><input type="date" class="form-control" th:field="*{dataCotacao}"/></div>
		<div class="form-group col-sm-2"><label class="control-label">Validade</label><input type="date" class="form-control" th:field="*{dataValidade}"/></div>
		<div class="form-group col-sm-2">
			<label class="control-label">Situação</label>
			<select class="form-control" th:field="*{situacao}">
				<option value="ABERTA">Aberta</option><option value="ENVIADA">Enviada</option><option value="ANALISADA">Analisada</option><option value="ENCERRADA">Encerrada</option>
			</select>
		</div>
	</div>
	<div class="form-group"><label class="control-label">Observação</label><textarea class="form-control" rows="2" th:field="*{observacao}"></textarea></div>
	<div class="row">
		<div class="col-sm-7">
			<h3>Itens</h3>
			<table class="table table-bordered table-condensed" id="tblItens">
				<thead><tr><th>Descrição</th><th>Un</th><th>Qtd</th><th></th></tr></thead>
				<tbody>
					<tr th:each="item, stat : *{itens}">
						<input type="hidden" th:field="*{itens[__${stat.index}__].codigo}"/>
						<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].descricao}"/></td>
						<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].unidade}" style="width:60px;"/></td>
						<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].quantidade}" style="width:90px;"/></td>
						<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
					</tr>
				</tbody>
			</table>
			<button type="button" class="btn btn-xs btn-default" onclick="addRow('tblItens','itens',3)">+ Item</button>
		</div>
		<div class="col-sm-5">
			<h3>Fornecedores</h3>
			<table class="table table-bordered table-condensed" id="tblForn">
				<thead><tr><th>Fornecedor</th><th></th></tr></thead>
				<tbody>
					<tr th:each="f, stat : *{fornecedores}">
						<input type="hidden" th:field="*{fornecedores[__${stat.index}__].codigo}"/>
						<td>
							<select class="form-control input-sm" th:field="*{fornecedores[__${stat.index}__].fornecedor}">
								<option th:each="forn : ${fornecedores}" th:value="${forn.codigo}" th:text="${forn.nome}"></option>
							</select>
						</td>
						<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
					</tr>
				</tbody>
			</table>
			<button type="button" class="btn btn-xs btn-default" onclick="addFornRow()">+ Fornecedor</button>
		</div>
	</div>
	<div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idxI = document.getElementById('tblItens').querySelector('tbody').rows.length;
var idxF = document.getElementById('tblForn').querySelector('tbody').rows.length;
function addRow(tid, prefix, cols) {
	var tbody = document.getElementById(tid).querySelector('tbody');
	var row = tbody.insertRow();
	row.innerHTML = '<td><input type="text" class="form-control input-sm" name="'+prefix+'['+idxI+'].descricao"/></td>' +
		'<td><input type="text" class="form-control input-sm" name="'+prefix+'['+idxI+'].unidade" style="width:60px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="'+prefix+'['+idxI+'].quantidade" value="0" style="width:90px;"/></td>' +
		'<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>';
	idxI++;
}
function addFornRow() {
	var tbody = document.getElementById('tblForn').querySelector('tbody');
	var row = tbody.insertRow();
	row.innerHTML = '<td><select class="form-control input-sm" name="fornecedores['+idxF+'].fornecedor"><option value="">Selecione...</option></select></td>' +
		'<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>';
	idxF++;
}
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
