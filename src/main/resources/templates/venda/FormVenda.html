<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Venda</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10"><h1 th:if="${venda.novo}">Nova Venda</h1><h1 th:unless="${venda.novo}">Editar Venda</h1></div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/vendas}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${venda}"
      th:action="${venda.novo} ? @{/vendas/novo} : @{/vendas/{c}(c=${venda.codigo})}">
    <sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="unidade">
            <label class="control-label">Unidade</label>
            <select class="form-control" th:field="*{unidade}">
                <option value="">Selecione...</option>
                <option th:each="u : ${unidades}" th:value="${u.codigo}" th:text="${u.identificacao + ' - ' + u.obra.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="cliente">
            <label class="control-label">Cliente</label>
            <select class="form-control" th:field="*{cliente}">
                <option value="">Selecione...</option>
                <option th:each="c : ${clientes}" th:value="${c.codigo}" th:text="${c.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Data Venda</label><input type="date" class="form-control" th:field="*{dataVenda}"/></div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Valor</label><input type="number" step="0.01" class="form-control" th:field="*{valorVenda}"/></div>
    </div>
    <div class="row">
        <div class="form-group col-sm-2">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="ATIVA">Ativa</option><option value="DISTRATADA">Distratada</option><option value="QUITADA">Quitada</option>
            </select>
        </div>
    </div>
    <div class="form-group"><label class="control-label">Observação</label><textarea class="form-control" rows="2" th:field="*{observacao}"></textarea></div>
    <h3>Parcelas</h3>
    <table class="table table-bordered table-condensed" id="tblParcelas">
        <thead><tr><th>#</th><th>Valor</th><th>Vencimento</th><th>Pagamento</th><th>Situação</th><th></th></tr></thead>
        <tbody>
            <tr th:each="p, stat : *{parcelas}">
                <input type="hidden" th:field="*{parcelas[__${stat.index}__].codigo}"/>
                <td><input type="number" class="form-control input-sm" th:field="*{parcelas[__${stat.index}__].numero}" style="width:60px;"/></td>
                <td><input type="number" step="0.01" class="form-control input-sm" th:field="*{parcelas[__${stat.index}__].valor}" style="width:100px;"/></td>
                <td><input type="date" class="form-control input-sm" th:field="*{parcelas[__${stat.index}__].dataVencimento}"/></td>
                <td><input type="date" class="form-control input-sm" th:field="*{parcelas[__${stat.index}__].dataPagamento}"/></td>
                <td>
                    <select class="form-control input-sm" th:field="*{parcelas[__${stat.index}__].situacao}">
                        <option value="ABERTA">Aberta</option><option value="PAGA">Paga</option><option value="ATRASADA">Atrasada</option>
                    </select>
                </td>
                <td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
            </tr>
        </tbody>
    </table>
    <button type="button" class="btn btn-xs btn-default" onclick="addParcela()">+ Parcela</button>
    <div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idx = document.getElementById('tblParcelas').querySelector('tbody').rows.length;
function addParcela() {
    var tbody = document.getElementById('tblParcelas').querySelector('tbody');
    var row = tbody.insertRow();
    row.innerHTML = '<td><input type="number" class="form-control input-sm" name="parcelas['+idx+'].numero" value="'+(idx+1)+'" style="width:60px;"/></td>' +
        '<td><input type="number" step="0.01" class="form-control input-sm" name="parcelas['+idx+'].valor" value="0" style="width:100px;"/></td>' +
        '<td><input type="date" class="form-control input-sm" name="parcelas['+idx+'].dataVencimento"/></td>' +
        '<td><input type="date" class="form-control input-sm" name="parcelas['+idx+'].dataPagamento"/></td>' +
        '<td><select class="form-control input-sm" name="parcelas['+idx+'].situacao"><option value="ABERTA">Aberta</option></select></td>' +
        '<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>';
    idx++;
}
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
