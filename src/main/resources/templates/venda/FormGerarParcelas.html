<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Parcelas da Venda</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-8">
        <h1>Parcelas — <small th:text="${venda.unidade.identificacao + ' / ' + venda.cliente.nome}"></small></h1>
        <p>Valor da venda: <strong th:text="'R$ ' + ${#numbers.formatDecimal(venda.valorVenda,1,2)}"></strong></p>
    </div>
    <div class="col-sm-4 text-right" style="margin-top:20px;">
        <a class="btn btn-default" th:href="@{/vendas}"><i class="glyphicon glyphicon-arrow-left"></i></a>
    </div>
</div></div></div>
<div class="container-fluid">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="row">
        <!-- Gerar Parcelas -->
        <div class="col-sm-6">
            <div class="panel panel-primary">
                <div class="panel-heading"><strong>Gerar Parcelas Automaticamente</strong></div>
                <div class="panel-body">
                    <form method="POST" th:action="@{/vendas/{c}/parcelas/gerar(c=${venda.codigo})}">
                        <div class="form-group">
                            <label>% Entrada</label>
                            <input type="number" step="0.01" name="percentualEntrada" class="form-control" value="20" min="0" max="100"/>
                        </div>
                        <div class="form-group">
                            <label>Nº Parcelas Mensais</label>
                            <input type="number" name="numeroParcelas" class="form-control" value="36" min="1"/>
                        </div>
                        <div class="form-group">
                            <label>% Chaves (entrega)</label>
                            <input type="number" step="0.01" name="percentualChaves" class="form-control" value="10" min="0" max="100"/>
                        </div>
                        <div class="form-group">
                            <label>Dia de Vencimento</label>
                            <input type="number" name="diaVencimento" class="form-control" value="10" min="1" max="28"/>
                        </div>
                        <div class="form-group">
                            <label>Data da 1ª Parcela</label>
                            <input type="date" name="dataInicio" class="form-control" th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}"/>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block"
                                onclick="return confirm('Gerar parcelas? As existentes serão mantidas.')">
                            <i class="glyphicon glyphicon-list-alt"></i> Gerar Parcelas
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <!-- Reajuste -->
        <div class="col-sm-6">
            <div class="panel panel-warning">
                <div class="panel-heading"><strong>Reajustar Parcelas em Aberto</strong></div>
                <div class="panel-body">
                    <form method="POST" th:action="@{/vendas/{c}/parcelas/reajustar(c=${venda.codigo})}">
                        <div class="form-group">
                            <label>Índice</label>
                            <select name="codigoIndice" class="form-control">
                                <option th:each="i : ${indices}" th:value="${i.codigo}" th:text="${i.sigla + ' — ' + i.nome}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Percentual do Período (%)</label>
                            <input type="number" step="0.0001" name="percentualIndice" class="form-control" placeholder="Ex: 0.52"/>
                        </div>
                        <button type="submit" class="btn btn-warning btn-block"
                                onclick="return confirm('Reajustar todas as parcelas ABERTAS?')">
                            <i class="glyphicon glyphicon-refresh"></i> Aplicar Reajuste
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela de parcelas -->
    <h3>Parcelas (<span th:text="${venda.parcelas.size()}"></span>)</h3>
    <table class="table table-bordered table-condensed">
        <thead><tr><th>#</th><th>Vencimento</th><th class="text-right">Valor</th><th>Pagamento</th><th>Situação</th></tr></thead>
        <tbody>
            <tr th:each="p : ${venda.parcelas}"
                th:classappend="${p.situacao == 'ABERTA' and p.dataVencimento.isBefore(T(java.time.LocalDate).now())} ? 'danger' : ''">
                <td th:text="${p.numero}"></td>
                <td th:text="${#temporals.format(p.dataVencimento,'dd/MM/yyyy')}"></td>
                <td class="text-right" th:text="${#numbers.formatDecimal(p.valor,1,2)}"></td>
                <td th:text="${p.dataPagamento != null} ? ${#temporals.format(p.dataPagamento,'dd/MM/yyyy')} : ''"></td>
                <td><span class="label" th:classappend="${p.situacao == 'PAGA'} ? 'label-success' : (${p.situacao == 'ATRASADA'} ? 'label-danger' : 'label-warning')" th:text="${p.situacao}"></span></td>
            </tr>
            <tr th:if="${venda.parcelas.isEmpty()}"><td colspan="5" class="text-muted text-center">Nenhuma parcela gerada</td></tr>
        </tbody>
        <tfoot th:unless="${venda.parcelas.isEmpty()}">
            <tr class="active">
                <td colspan="2"><strong>Total</strong></td>
                <td class="text-right"><strong th:text="${#numbers.formatDecimal(venda.valorVenda,1,2)}"></strong></td>
                <td colspan="2"></td>
            </tr>
        </tfoot>
    </table>
</div>
</section></body></html>
