<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Proposta</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10"><h1 th:if="${proposta.novo}">Nova Proposta</h1><h1 th:unless="${proposta.novo}">Editar Proposta</h1></div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/propostas}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${proposta}"
      th:action="${proposta.novo} ? @{/propostas/novo} : @{/propostas/{c}(c=${proposta.codigo})}">
    <sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="unidade">
            <label class="control-label">Unidade</label>
            <select class="form-control" th:field="*{unidade}">
                <option value="">Selecione...</option>
                <option th:each="u : ${unidades}" th:value="${u.codigo}" th:text="${u.identificacao + ' - ' + u.obra.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="cliente">
            <label class="control-label">Cliente</label>
            <select class="form-control" th:field="*{cliente}">
                <option value="">Selecione...</option>
                <option th:each="c : ${clientes}" th:value="${c.codigo}" th:text="${c.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Data</label><input type="date" class="form-control" th:field="*{dataProposta}"/></div>
        <div class="form-group col-sm-2 sn-required"><label class="control-label">Valor</label><input type="number" step="0.01" class="form-control" th:field="*{valorProposto}"/></div>
    </div>
    <div class="row">
        <div class="form-group col-sm-2">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="PENDENTE">Pendente</option><option value="APROVADA">Aprovada</option><option value="RECUSADA">Recusada</option>
            </select>
        </div>
    </div>
    <div class="form-group"><label class="control-label">Observação</label><textarea class="form-control" rows="2" th:field="*{observacao}"></textarea></div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
