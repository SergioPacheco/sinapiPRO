<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Propostas</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-xs-10"><h1>Propostas</h1></div>
    <div class="col-xs-2"><a class="btn btn-success" th:href="@{/propostas/novo}"><i class="glyphicon glyphicon-plus"></i></a></div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
    <thead><tr><th>Unidade</th><th>Cliente</th><th>Data</th><th class="text-right">Valor</th><th>Situação</th><th class="table-col-acoes"></th></tr></thead>
    <tbody>
        <tr th:each="p : ${propostas}">
            <td th:text="${p.unidade.identificacao}"></td>
            <td th:text="${p.cliente.nome}"></td>
            <td th:text="${#temporals.format(p.dataProposta,'dd/MM/yyyy')}"></td>
            <td class="text-right" th:text="${#numbers.formatDecimal(p.valorProposto,1,2)}"></td>
            <td><span class="label" th:classappend="${p.situacao == 'APROVADA'} ? 'label-success' : (${p.situacao == 'PENDENTE'} ? 'label-warning' : 'label-default')" th:text="${p.situacao}"></span></td>
            <td class="text-center"><a class="btn btn-link btn-xs" th:href="@{/propostas/{c}(c=${p.codigo})}"><i class="glyphicon glyphicon-pencil"></i></a></td>
        </tr>
        <tr th:if="${propostas.isEmpty()}"><td colspan="6">Nenhuma proposta encontrada</td></tr>
    </tbody>
</table>
</div>
</section></body></html>
