<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Contrato</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${contrato.novo}">Novo Contrato</h1><h1 th:unless="${contrato.novo}" th:text="|Contrato: ${contrato.descricao}|">Contrato</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/contratos}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${contrato}"
	  th:action="${contrato.novo} ? @{/contratos/novo} : @{/contratos/{c}(c=${contrato.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-2"><label class="control-label">Número</label><input type="text" class="form-control" th:field="*{numero}"/></div>
		<div class="form-group col-sm-6 sn-required" sinapiPRO:classforerror="descricao"><label class="control-label">Descrição</label><input type="text" class="form-control" th:field="*{descricao}"/></div>
		<div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="obra">
			<label class="control-label">Obra</label>
			<select class="form-control" th:field="*{obra}">
				<option value="">Selecione...</option>
				<option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
			</select>
		</div>
	</div>
	<div class="row">
		<div class="form-group col-sm-4">
			<label class="control-label">Cliente</label>
			<select class="form-control" th:field="*{cliente}">
				<option value="">Selecione...</option>
				<option th:each="c : ${clientes}" th:value="${c.codigo}" th:text="${c.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2"><label class="control-label">Início</label><input type="date" class="form-control" th:field="*{dataInicio}"/></div>
		<div class="form-group col-sm-2"><label class="control-label">Fim</label><input type="date" class="form-control" th:field="*{dataFim}"/></div>
		<div class="form-group col-sm-2">
			<label class="control-label">Situação</label>
			<select class="form-control" th:field="*{situacao}">
				<option value="ABERTO">Aberto</option><option value="ENCERRADO">Encerrado</option><option value="SUSPENSO">Suspenso</option>
			</select>
		</div>
	</div>
	<div class="form-group"><label class="control-label">Observação</label><textarea class="form-control" rows="2" th:field="*{observacao}"></textarea></div>
	<h3>Itens do Contrato</h3>
	<table class="table table-bordered table-condensed" id="tblItens">
		<thead><tr><th>Descrição</th><th>Un</th><th>Qtd</th><th>Vl. Unit.</th><th>Total</th><th></th></tr></thead>
		<tbody>
			<tr th:each="item, stat : *{itens}">
				<input type="hidden" th:field="*{itens[__${stat.index}__].codigo}"/>
				<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].descricao}"/></td>
				<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].unidade}" style="width:60px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].quantidade}" style="width:90px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].valorUnitario}" style="width:100px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].valorTotal}" style="width:100px;" readonly/></td>
				<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
			</tr>
		</tbody>
	</table>
	<button type="button" class="btn btn-xs btn-default" onclick="addItemRow()">+ Item</button>
	<div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idx = document.getElementById('tblItens').querySelector('tbody').rows.length;
function addItemRow() {
	var tbody = document.getElementById('tblItens').querySelector('tbody');
	var row = tbody.insertRow();
	row.innerHTML = '<td><input type="text" class="form-control input-sm" name="itens['+idx+'].descricao"/></td>' +
		'<td><input type="text" class="form-control input-sm" name="itens['+idx+'].unidade" style="width:60px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idx+'].quantidade" value="0" style="width:90px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idx+'].valorUnitario" value="0" style="width:100px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idx+'].valorTotal" value="0" style="width:100px;" readonly/></td>' +
		'<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>';
	idx++;
}
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
