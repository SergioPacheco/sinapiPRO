<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
				xmlns:th="http://www.thymeleaf.org"
				xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
				layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Tipo de Usuário</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-10">
					<h1 th:if="${tipoUsuario.novo}">Cadastro de Tipo de Usuário</h1>
					<h1 th:unless="${tipoUsuario.novo}" th:text="|Edição de ${tipoUsuario.nome}|">Edição</h1>
				</div>
				<div class="col-sm-2">
					<div class="aw-page-header-controls">
						<a class="btn btn-default" th:href="@{/tiposUsuario}">
							<i class="glyphicon glyphicon-search"></i>
							<span class="hidden-xs hidden-sm">Pesquisa</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="container-fluid">
		<form method="POST" th:object="${tipoUsuario}" class="form-vertical js-form-loading"
			th:action="${tipoUsuario.novo} ? @{/tiposUsuario/novo} : @{/tiposUsuario/{codigo}(codigo=${tipoUsuario.codigo})}">
			<sinapiPRO:message/>
			<input type="hidden" th:field="*{codigo}"/>
			<div class="row">
				<div class="form-group col-sm-10 sn-required" sinapiPRO:classforerror="nome">
					<label for="nome" class="control-label">Nome</label>
					<input id="nome" type="text" class="form-control" th:field="*{nome}" />
				</div>
			</div>
			<button class="btn btn-primary" type="submit">Salvar</button>
		</form>
	</div>
</section>
</body>
</html>
