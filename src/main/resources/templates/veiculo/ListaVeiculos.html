<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Frota — Veículos</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-8"><h1>Frota — Veículos</h1></div>
    <div class="col-sm-4 text-right" style="margin-top:20px;">
        <a class="btn btn-success" th:href="@{/frota/novo}"><i class="glyphicon glyphicon-plus"></i> Novo Veículo</a>
    </div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
    <thead>
        <tr>
            <th>Placa</th>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Ano</th>
            <th>Tipo</th>
            <th>Ativo</th>
            <th class="table-col-acoes"></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="v : ${veiculos}">
            <td><strong th:text="${v.placa}"></strong></td>
            <td th:text="${v.modelo}"></td>
            <td th:text="${v.marca}"></td>
            <td th:text="${v.ano}"></td>
            <td th:text="${v.tipo}"></td>
            <td>
                <span th:if="${v.ativo}" class="label label-success">Sim</span>
                <span th:unless="${v.ativo}" class="label label-default">Não</span>
            </td>
            <td class="text-center">
                <a class="btn btn-link btn-xs" th:href="@{/frota/{c}(c=${v.codigo})}">
                    <i class="glyphicon glyphicon-pencil"></i>
                </a>
                <a class="btn btn-link btn-xs" th:href="@{/frota/{c}/manutencao(c=${v.codigo})}"
                   title="Manutenções">
                    <i class="glyphicon glyphicon-wrench"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${veiculos.isEmpty()}"><td colspan="7">Nenhum veículo cadastrado</td></tr>
    </tbody>
</table>
</div>
</section></body></html>
