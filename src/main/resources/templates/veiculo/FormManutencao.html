<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Agendamento de Manutenção</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10">
        <h1 th:if="${agendamentoManutencao.novo}">Novo Agendamento</h1>
        <h1 th:unless="${agendamentoManutencao.novo}" th:text="|Manutenção: ${agendamentoManutencao.tipoManutencao}|">Manutenção</h1>
    </div>
    <div class="col-sm-2">
        <a class="btn btn-default" th:href="@{/frota/{c}/manutencao(c=${veiculo.codigo})}">
            <i class="glyphicon glyphicon-arrow-left"></i>
        </a>
    </div>
</div></div></div>
<div class="container-fluid">
<div class="alert alert-info">
    Veículo: <strong th:text="${veiculo.placa + ' — ' + veiculo.modelo}"></strong>
</div>
<form method="POST" th:object="${agendamentoManutencao}"
      th:action="@{/frota/{c}/manutencao(c=${veiculo.codigo})}">
    <sinapiPRO:message/>
    <input type="hidden" th:field="*{codigo}"/>
    <input type="hidden" th:field="*{veiculo.codigo}"/>
    <div class="row">
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="tipoManutencao">
            <label class="control-label">Tipo de Manutenção</label>
            <select class="form-control" th:field="*{tipoManutencao}">
                <option value="">Selecione...</option>
                <option value="Troca de Óleo">Troca de Óleo</option>
                <option value="Revisão Geral">Revisão Geral</option>
                <option value="Troca de Pneus">Troca de Pneus</option>
                <option value="Freios">Freios</option>
                <option value="Suspensão">Suspensão</option>
                <option value="Elétrica">Elétrica</option>
                <option value="Funilaria/Pintura">Funilaria/Pintura</option>
                <option value="Preventiva">Preventiva</option>
                <option value="Corretiva">Corretiva</option>
            </select>
        </div>
        <div class="form-group col-sm-2 sn-required">
            <label class="control-label">Data Agendamento</label>
            <input type="date" class="form-control" th:field="*{dataAgendamento}"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Data Realização</label>
            <input type="date" class="form-control" th:field="*{dataRealizacao}"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">KM Atual</label>
            <input type="number" class="form-control" th:field="*{kmAtual}"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Valor (R$)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valor}"/>
        </div>
    </div>
    <div class="row">
        <div class="form-group col-sm-2">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="AGENDADO">Agendado</option>
                <option value="REALIZADO">Realizado</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
        </div>
        <div class="form-group col-sm-8">
            <label class="control-label">Observação</label>
            <input type="text" class="form-control" th:field="*{observacao}"/>
        </div>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
