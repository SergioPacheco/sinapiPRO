<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
				xmlns:th="http://www.thymeleaf.org">
<body>
	<!-- Modal -->
	<div class="modal fade" id="modalCadastroRapidoBasePreco" tabindex="-1" role="dialog" th:fragment="modal">
		<div class="modal-dialog  modal-sm" >
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span>
					</button>
					<h4 class="modal-title">Cadastro de Base de Preços</h4>
				</div>
				<div class="modal-body">
					<div class="alert  alert-danger  hidden  js-mensagem-cadastro-rapido-basePreco" role="alert"></div>
					<form class="form-horizontal" th:action="@{/basePrecos}">
					     
						<div class="form-group  bw-required">
							<label class="col-sm-2  control-label" for="nomeBase">Nome</label>
							<div class="col-sm-10">
								<input id="nomeBase" type="text" class="form-control">
							</div>
						</div>
						
						<div class="form-group  bw-required">
							<label class="col-sm-2  control-label" for="nomeBase">Nome</label>
							<div class="col-sm-10">
								<input id="nomeBase" type="text" class="form-control">
							</div>
						</div>
						
						<div class="form-group  col-sm-4">
							<label for="estado">Estado</label>
							<select id="estado" class="form-control" th:field="*{endereco.estado}">
			                    <option value="">Selecione o estado</option>
			                    <option th:each="estado : ${estados}" th:value="${estado.codigo}" th:text="${estado.nome}">São Paulo</option>
			                </select>
						</div>
						
						
						
					</form>
					<button type="button" class="btn btn-primary  js-modal-cadastro-classe-salvar-btn">Salvar</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
