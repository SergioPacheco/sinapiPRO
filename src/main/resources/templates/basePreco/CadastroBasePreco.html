<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
				xmlns:th="http://www.thymeleaf.org"
				xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
				layout:decorate="~{layout/LayoutPadrao}">

<head>
	<title>Cadastro de Base de Preços</title>
	<link rel="stylesheet" type="text/css" th:href="@{/stylesheets/vendors/bootstrap-switch.min.css}"/>
</head>
<body>
<section layout:fragment="conteudo">

	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-6">
					<h1 th:if="${basePreco.nova}">Cadastro de Base de Preços</h1>
					<h1 th:unless="${basePreco.nova}" th:text="|Edição de ${basePreco.nome}|">Edição de Base de Preços</h1>
				</div>
				<div class="col-sm-6">
					<div class="aw-page-header-controls">
						<div th:if="${basePreco.nova}">	</div>
						<div th:unless="${basePreco.nova}">
							 <a class="btn  btn-default" th:href="@{/basePrecos/importaInsumo/{codigo}(codigo=${basePreco.codigo})}"> 
					  		  	<i class="glyphicon  glyphicon-th-list"></i> 
					   			<span class="hidden-xs  hidden-sm"> Importa Insumos</span>
							 </a>
							 <a class="btn  btn-default" th:href="@{/basePrecos/importaComposicao/{codigo}(codigo=${basePreco.codigo})}"> 
					  		  	<i class="glyphicon  glyphicon-th-list"></i> 
					   			<span class="hidden-xs  hidden-sm"> Importa Composições</span>
							 </a>
						</div>	 
						<a class="btn  btn-default" th:href="@{/basePrecos}"> 
					   		<i class="glyphicon  glyphicon-plus-sign"></i> 
					   		<span class="hidden-xs  hidden-sm">Pesquisa</span>
						</a>
					</div>
					 
				</div>
			</div>
		</div>
	</div>
	
	<div class="container-fluid">
		<form method="POST" 
		      th:object="${basePreco}" 
		      class="form-vertical  js-form-loading"
			  th:action="${basePreco.nova} ? @{/basePrecos/nova} : @{/basePrecos/{codigo}(codigo=${basePreco.codigo})}">
			
			<sinapiPRO:message/>
			
			<input type="hidden" th:field="*{codigo}"/>
			
			<div class="row">
			     
				<div class="form-group col-sm-12    sn-required" sinapiPRO:classforerror="nome">
					<label for="nome" class="control-label">Nome</label>
					<input id="nome" type="text" class="form-control" th:field="*{nome}" />
				</div>	
			</div>
			
			<div class="row">
			
				<div class="form-group  col-sm-3 sn-required"  sinapiPRO:classforerror="estado">
					<label for="estado">Estado</label>
					<select id="estado" class="form-control" th:field="*{estado}">
					
	                    <option value="">Selecione o estado</option>
	                
	                    <option th:each="estado : ${estados}" 
	                            th:value="${estado.codigo}" 
	                            th:text="${estado.nome}">São Paulo</option>
	                </select>
				</div>
				 
				<div class="form-group  col-sm-3 sn-required"  sinapiPRO:classforerror="baseInsumo">
					<label for="baseInsumo">Base Insumos</label>
					<select id="baseInsumo" class="form-control" th:field="*{baseInsumo}">
	                    
	                    <option value="">Selecione a Base de Insumos</option>
	                    
	                    <option th:each="baseInsumo : ${baseInsumos}" 
	                            th:value="${baseInsumo.codigo}" 
	                            th:text="${baseInsumo.nome}">SINAPI</option>
	                </select>
				</div>
				
				<div class="form-group  col-sm-3 sn-required"  sinapiPRO:classforerror="dataReferencia">
					<label for="dataReferencia" class="control-label">Data de Referência</label>
					<input type="text" class="form-control  js-date" id="dataReferencia" th:field="*{dataReferencia}" autocomplete="off"/>
				</div>
				
				<div class="col-sm-3  form-group  sn-required">
					<label for="desoneracao" class="control-label">Oneração</label>
					<select id="desoneracao" class="form-control" th:field="*{desoneracao}">
						<option value="">Selecione a Oneração</option>
						<option th:each="desoneracao : ${desoneracoes}" 
						           th:value="${desoneracao}" 
						           th:text="${desoneracao.descricao}">NaoDesonerado</option>
					</select>
				</div>
			</div>
			
			<button class="btn  btn-primary" type="submit">Salvar</button>
			
		</form>
	</div>
</section>
</body>
</html>
