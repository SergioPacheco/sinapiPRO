<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:data="http://www.thymeleaf.org/extras/data"
	xmlns:sinapiPRO="http://sinapiPRO.ifrn.edu.br">
	
<head>
	<title>Pesquisa de insumos</title>
</head>

<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-xs-10">
					<h1>Pesquisa de insumos</h1>
				</div>
				
				<div class="col-xs-2">
					<div class="aw-page-header-controls">
						<a class="btn  btn-default" th:href="@{/insumos/novo}">
							<i class="glyphicon  glyphicon-plus-sign"></i> <span class="hidden-xs  hidden-sm">Novo insumo</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container-fluid">
		<form method="GET" th:object="${insumoFilter}">
		
			<div class="row">
				<div class="form-group  col-sm-2">
					<label class="control-label" for="sku">Código Insumo</label>
					<input type="text" class="form-control" id="sku" autofocus="autofocus" th:field="*{sku}"/>
				</div>
			 
				<div class="form-group  col-sm-10">
					<label class="control-label" for="sku">Descrição</label>
					<input type="text" class="form-control" id="descricao" autofocus="autofocus" th:field="*{descricao}"/>
				</div>
				
				
			</div>

			<div class="row">
				<div class="form-group  col-sm-2">
					<label for="estado">Estado</label>
					<select id="estado" class="form-control" th:field="*{estado}">
	                    <option value="">Todos</option>
	                    <option th:each="estado : ${estados}" th:value="${estado.codigo}" th:text="${estado.nome}">São Paulo</option>
	                </select>
				</div>
				 
				<div class="form-group  col-sm-2" >
					<label class="control-label" for="anoMes">AnoMes</label>
					<input type="text" class="form-control" id="anoMes" th:field="*{anoMes}"/>
				</div>
				
				<div class="form-group col-sm-8">
					<label for="valorDe">Valor unitário</label>
					<div class="form-inline">
						<input type="text" class="form-control  aw-form-control-inline-sm  js-decimal" id="valorDe" th:field="*{valorDe}"/>
						<label for="valorAte" class="aw-form-label-between">até</label>
						<input type="text" class="form-control  aw-form-control-inline-sm  js-decimal" id="valorAte" th:field="*{valorAte}"/>
					</div>
				</div>
			</div>
			
			<button type="submit" class="btn  btn-primary">Pesquisar</button>
		</form>
		
		<div class="table-responsive  bw-tabela-simples">
			<table class="table  table-hover">
				<thead>
					<tr>
						<th class="table-insumos-col-sku">
							<sinapiPRO:order page="${pagina}" field="sku" text="Código"/>
						</th>
						<th class="table-insumos-col-preco">Preco</th>
						<th class="table-insumos-col-descricao">
							<sinapiPRO:order page="${pagina}" field="descricao" text="Descricao"/>
						</th>
						
						<th class="table-insumos-col-acoes"></th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="insumo : ${pagina.conteudo}">
						 
						<td class="text-center" th:text="${insumo.sku}">1234</td>
						<td class="text-right" th:text="|R$ ${{insumo.preco}}|">R$ 8.00</td>
						<td th:text="${insumo.descricao}">Pedreiro</td>
						<td class="text-center">
							<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" 
									th:href="@{/insumos/{codigo}(codigo=${insumo.codigo})}"> 
								<i class="glyphicon glyphicon-pencil"></i>
							</a>
							<a class="btn  btn-link  btn-xs  js-tooltip  js-exclusao-btn" title="Excluir" href="#" 
									data:url="@{/insumos/{codigo}(codigo=${insumo.codigo})}"
									data:objeto="${insumo.descricao}">
								<i class="glyphicon glyphicon-remove"></i>
							</a>
						</td>
					</tr>
					<tr th:if="${pagina.vazia}">
						<td colspan="7">Nenhum insumo encontrado</td>
					</tr>
				</tbody>
				
			</table>
		</div>
		
		<sinapiPRO:pagination page="${pagina}"/>
		
	</div>

</section>
</body>
</html>
