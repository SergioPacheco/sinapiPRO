<!DOCTYPE html> 
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
	
<div th:fragment="pesquisaRapidaPrecos"
     id="pesquisaRapidaPrecos" 
	 class="modal  fade" 
     tabindex="-1" 
     role="dialog" >
     
 	<div class="modal-dialog">
   		<div class="modal-content">
   		
   			<div class="modal-header">
       			<button type="button" class="close" data-dismiss="modal"> <i>&times;</i></button>
        		<h4 class="modal-title">Histórico de Preços</h4>
      		</div>
      		
   			<div class="modal-body">
   			
   				<div class="alert  alert-danger  alert-dismissible  hidden  js-mensagem-erro" 
   				     role="alert">
					<button type="button" 
					        class="close" 
					        data-dismiss="alert" >
					        <span aria-hidden="true">&times;</span>
					</button>
					<div><i class="fa  fa-exclamation-circle"></i>Erro na Pesquisa</div>
				</div>
   			
		        <div id="containerTabelaPesquisaRapidaPrecos">  </div>
		        
     		</div>
   		</div>
 	</div>
 	
 	<!-- <th:block th:replace="hbs/TabelaPesquisaRapidaPrecos"></th:block> --> 
 	
	<script id="tabela-pesquisa-rapida-preco" type="text/x-handlebars-template">
	<div class="table-responsive  sn-tabela-simples" style="margin-top: 15px">
		<table class="table  table-hover">
			<thead>
				<tr>
					<th class="col-sm-2">Referência</th>
					<th class="col-sm-2">Preco</th>
				</tr>
			</thead>
				
			<tbody>
				{{#if .}}
					{{#each .}}
						<tr data-anoMes="{{anoMes}}" data-preco="{{preco}}" class="js-preco-pesquisa-rapida">
							<td>{{anoMes}}</td>
							<td>{{preco}}</td>
 						</tr>
					{{/each}}
				{{else}}
					<tr>
						<td colspan="2">Nenhuma Base Preço encontrada</td>
					</tr>
				{{/if}}
			</tbody>
		</table>
	</div>
</script>
 	
 	
</div>
	
</html>
