<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Atendimento</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-10">
        <h1 th:if="${atendimento.novo}">Novo Atendimento</h1>
        <h1 th:unless="${atendimento.novo}" th:text="|Atendimento: ${atendimento.titulo}|">Atendimento</h1>
    </div>
    <div class="col-sm-2"><a class="btn btn-default" th:href="@{/atendimentos}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${atendimento}"
      th:action="${atendimento.novo} ? @{/atendimentos/novo} : @{/atendimentos/{c}(c=${atendimento.codigo})}">
    <sinapiPRO:message/>
    <input type="hidden" th:field="*{codigo}"/>
    <div class="row">
        <div class="form-group col-sm-8 sn-required" sinapiPRO:classforerror="titulo">
            <label class="control-label">Título</label>
            <input type="text" class="form-control" th:field="*{titulo}"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Tipo</label>
            <select class="form-control" th:field="*{tipo}">
                <option value="">Selecione...</option>
                <option value="RECLAMACAO">Reclamação</option>
                <option value="SOLICITACAO">Solicitação</option>
                <option value="GARANTIA">Garantia</option>
                <option value="INFORMACAO">Informação</option>
            </select>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Prioridade</label>
            <select class="form-control" th:field="*{prioridade}">
                <option value="BAIXA">Baixa</option>
                <option value="NORMAL">Normal</option>
                <option value="ALTA">Alta</option>
                <option value="URGENTE">Urgente</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="cliente">
            <label class="control-label">Cliente</label>
            <select class="form-control" th:field="*{cliente}">
                <option value="">Selecione...</option>
                <option th:each="c : ${clientes}" th:value="${c.codigo}" th:text="${c.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-4">
            <label class="control-label">Obra</label>
            <select class="form-control" th:field="*{obra}">
                <option value="">Nenhuma</option>
                <option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
            </select>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Responsável</label>
            <input type="text" class="form-control" th:field="*{responsavel}"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Situação</label>
            <select class="form-control" th:field="*{situacao}">
                <option value="ABERTO">Aberto</option>
                <option value="EM_ANDAMENTO">Em Andamento</option>
                <option value="AGUARDANDO">Aguardando</option>
                <option value="ENCERRADO">Encerrado</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="form-group col-sm-2 sn-required">
            <label class="control-label">Data Abertura</label>
            <input type="date" class="form-control" th:field="*{dataAbertura}"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Previsão</label>
            <input type="date" class="form-control" th:field="*{dataPrevisao}"/>
        </div>
        <div class="form-group col-sm-2">
            <label class="control-label">Encerramento</label>
            <input type="date" class="form-control" th:field="*{dataEncerramento}"/>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label">Descrição</label>
        <textarea class="form-control" rows="4" th:field="*{descricao}"></textarea>
    </div>
    <div th:unless="${atendimento.novo}">
        <h3>Ordens de Serviço</h3>
        <table class="table table-bordered table-condensed">
            <thead><tr><th>#</th><th>Descrição</th><th>Emissão</th><th>Execução</th><th class="text-right">Valor</th><th>Situação</th></tr></thead>
            <tbody>
                <tr th:each="os : *{ordensServico}">
                    <td th:text="${os.numero}"></td>
                    <td th:text="${os.descricao}"></td>
                    <td th:text="${#temporals.format(os.dataEmissao,'dd/MM/yyyy')}"></td>
                    <td th:text="${os.dataExecucao != null} ? ${#temporals.format(os.dataExecucao,'dd/MM/yyyy')} : ''"></td>
                    <td class="text-right" th:text="${#numbers.formatDecimal(os.valor,1,2)}"></td>
                    <td><span class="label" th:classappend="${os.situacao == 'CONCLUIDA'} ? 'label-success' : 'label-warning'" th:text="${os.situacao}"></span></td>
                </tr>
                <tr th:if="${atendimento.ordensServico.isEmpty()}"><td colspan="6">Nenhuma OS vinculada</td></tr>
            </tbody>
        </table>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
</form>
</div>
</section></body></html>
