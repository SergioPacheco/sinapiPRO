<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Atendimentos</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
    <div class="col-sm-8"><h1>Atendimentos</h1></div>
    <div class="col-sm-4 text-right" style="margin-top:20px;">
        <a class="btn btn-success" th:href="@{/atendimentos/novo}"><i class="glyphicon glyphicon-plus"></i> Novo</a>
    </div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
    <thead>
        <tr>
            <th>Título</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Prioridade</th>
            <th>Abertura</th>
            <th>Previsão</th>
            <th>Situação</th>
            <th class="table-col-acoes"></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="a : ${atendimentos}"
            th:classappend="${a.situacao == 'ABERTO' and a.dataPrevisao != null and a.dataPrevisao.isBefore(T(java.time.LocalDate).now())} ? 'danger' : ''">
            <td th:text="${a.titulo}"></td>
            <td th:text="${a.cliente.nome}"></td>
            <td th:text="${a.tipo}"></td>
            <td>
                <span class="label"
                      th:classappend="${a.prioridade == 'ALTA'} ? 'label-danger' : (${a.prioridade == 'NORMAL'} ? 'label-warning' : 'label-default')"
                      th:text="${a.prioridade}"></span>
            </td>
            <td th:text="${#temporals.format(a.dataAbertura,'dd/MM/yyyy')}"></td>
            <td th:text="${a.dataPrevisao != null} ? ${#temporals.format(a.dataPrevisao,'dd/MM/yyyy')} : ''"></td>
            <td>
                <span class="label"
                      th:classappend="${a.situacao == 'ABERTO'} ? 'label-info' : (${a.situacao == 'ENCERRADO'} ? 'label-success' : 'label-default')"
                      th:text="${a.situacao}"></span>
            </td>
            <td class="text-center">
                <a class="btn btn-link btn-xs" th:href="@{/atendimentos/{c}(c=${a.codigo})}">
                    <i class="glyphicon glyphicon-pencil"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${atendimentos.isEmpty()}"><td colspan="8">Nenhum atendimento encontrado</td></tr>
    </tbody>
</table>
</div>
</section></body></html>
