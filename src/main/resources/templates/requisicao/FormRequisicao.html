<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Requisição de Insumos</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${requisicao.novo}">Nova Requisição</h1><h1 th:unless="${requisicao.novo}" th:text="|Requisição #${requisicao.numero}|">Requisição</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/requisicoes}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${requisicao}"
	  th:action="${requisicao.novo} ? @{/requisicoes/novo} : @{/requisicoes/{c}(c=${requisicao.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<input type="hidden" th:field="*{numero}"/>
	<div class="row">
		<div class="form-group col-sm-4 sn-required" sinapiPRO:classforerror="obra">
			<label class="control-label">Obra</label>
			<select class="form-control" th:field="*{obra}">
				<option value="">Selecione...</option>
				<option th:each="o : ${obras}" th:value="${o.codigo}" th:text="${o.nome}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2 sn-required" sinapiPRO:classforerror="dataRequisicao">
			<label class="control-label">Data</label><input type="date" class="form-control" th:field="*{dataRequisicao}"/>
		</div>
		<div class="form-group col-sm-2">
			<label class="control-label">Situação</label>
			<select class="form-control" th:field="*{situacao}">
				<option value="ABERTA">Aberta</option><option value="ATENDIDA">Atendida</option><option value="CANCELADA">Cancelada</option>
			</select>
		</div>
	</div>
	<div class="form-group"><label class="control-label">Observação</label><textarea class="form-control" rows="2" th:field="*{observacao}"></textarea></div>
	<h3>Itens</h3>
	<table class="table table-bordered table-condensed" id="tblItens">
		<thead><tr><th>Insumo (opcional)</th><th>Descrição</th><th>Un</th><th>Qtd Solicitada</th><th>Qtd Atendida</th><th>Situação</th><th></th></tr></thead>
		<tbody>
			<tr th:each="item, stat : *{itens}">
				<input type="hidden" th:field="*{itens[__${stat.index}__].codigo}"/>
				<td>
					<select class="form-control input-sm" th:field="*{itens[__${stat.index}__].insumo}">
						<option value="">Nenhum</option>
						<option th:each="i : ${insumos}" th:value="${i.codigo}" th:text="${i.descricao}"></option>
					</select>
				</td>
				<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].descricao}"/></td>
				<td><input type="text" class="form-control input-sm" th:field="*{itens[__${stat.index}__].unidade}" style="width:60px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].quantidade}" style="width:90px;"/></td>
				<td><input type="number" step="0.01" class="form-control input-sm" th:field="*{itens[__${stat.index}__].quantidadeAtendida}" style="width:90px;"/></td>
				<td>
					<select class="form-control input-sm" th:field="*{itens[__${stat.index}__].situacao}">
						<option value="PENDENTE">Pendente</option><option value="ATENDIDO">Atendido</option><option value="PARCIAL">Parcial</option>
					</select>
				</td>
				<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>
			</tr>
		</tbody>
	</table>
	<button type="button" class="btn btn-xs btn-default" onclick="addItemRow()">+ Item</button>
	<div style="margin-top:20px;"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
<script>
var idx = document.getElementById('tblItens').querySelector('tbody').rows.length;
function addItemRow() {
	var tbody = document.getElementById('tblItens').querySelector('tbody');
	var row = tbody.insertRow();
	row.innerHTML = '<td><select class="form-control input-sm" name="itens['+idx+'].insumo"><option value="">Nenhum</option></select></td>' +
		'<td><input type="text" class="form-control input-sm" name="itens['+idx+'].descricao"/></td>' +
		'<td><input type="text" class="form-control input-sm" name="itens['+idx+'].unidade" style="width:60px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idx+'].quantidade" value="0" style="width:90px;"/></td>' +
		'<td><input type="number" step="0.01" class="form-control input-sm" name="itens['+idx+'].quantidadeAtendida" value="0" style="width:90px;"/></td>' +
		'<td><select class="form-control input-sm" name="itens['+idx+'].situacao"><option value="PENDENTE">Pendente</option></select></td>' +
		'<td><button type="button" class="btn btn-xs btn-danger js-remove-row">×</button></td>';
	idx++;
}
document.addEventListener('click', function(e) { if (e.target.classList.contains('js-remove-row')) e.target.closest('tr').remove(); });
</script>
</section></body></html>
