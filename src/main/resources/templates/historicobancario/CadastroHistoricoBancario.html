<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Histórico Bancário</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${historicoBancario.novo}">Novo Histórico</h1><h1 th:unless="${historicoBancario.novo}" th:text="|Edição: ${historicoBancario.descricao}|">Histórico</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/historicosBancarios}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${historicoBancario}" th:action="${historicoBancario.novo} ? @{/historicosBancarios/novo} : @{/historicosBancarios/{c}(c=${historicoBancario.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="form-group col-sm-8 sn-required"><label class="control-label">Descrição</label><input type="text" class="form-control" th:field="*{descricao}"/></div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form></div>
</section></body></html>
