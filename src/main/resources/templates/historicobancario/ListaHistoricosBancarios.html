<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Históricos Bancários</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-xs-10"><h1>Históricos Bancários</h1></div>
	<div class="col-xs-2"><a class="btn btn-default" th:href="@{/historicosBancarios/novo}"><i class="glyphicon glyphicon-plus-sign"></i></a></div>
</div></div></div>
<div class="container-fluid">
<table class="table table-hover table-bordered">
	<thead><tr><th>Código</th><th>Descrição</th><th class="table-col-acoes"></th></tr></thead>
	<tbody>
		<tr th:each="h : ${historicos}">
			<td th:text="${h.codigo}"></td><td th:text="${h.descricao}"></td>
			<td class="text-center"><a class="btn btn-link btn-xs" th:href="@{/historicosBancarios/{c}(c=${h.codigo})}"><i class="glyphicon glyphicon-pencil"></i></a></td>
		</tr>
		<tr th:if="${historicos.isEmpty()}"><td colspan="3">Nenhum histórico cadastrado</td></tr>
	</tbody>
</table>
</div>
</section></body></html>
