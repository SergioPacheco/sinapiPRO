<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:data="http://www.thymeleaf.org/extras/data">

<div class="bw-tabela-item  js-tabela-item" th:each="item : ${itens}" data:valor-total="${valorTotal}">

	<div class="bw-tabela-item__coluna  bw-tabela-item__coluna--detalhes">
		<span class="label  label-default" th:text="${item.insumo.sku}">45623</span>
		<span class="bw-tabela-insumo-descricao" th:text="${item.insumo.descricao}">Pedreiro</span> 
		
		<span class="bw-tabela-insumo-base" th:text="${item.insumo.base.descricao}">Sinapi</span>
	</div>

	<div class="bw-tabela-item__coluna  bw-tabela-item__coluna--valores">
		<div class="bw-tabela-insumo-valor-pequeno">
			<input type="text" maxlength="3"
				class="bw-tabela-insumo-campo-coeficiente  js-tabela-insumo-coeficiente-item"
				th:value="${item.coeficiente}"
				data:codigo-insumo="${item.insumo.codigo}"/> 
				<span>x	R$[[${{item.precoUnitario}}]]</span>
		</div>
		<div class="bw-tabela-insumo-valor-grande">R$[[${{item.valorTotal}}]]</div>
	</div>
	<div class="bw-tabela-item__painel-exclusao">
		<span class="bw-tabela-item__titulo-exclusao">Excluir este item	da venda?</span>
		<button type="button" class="btn  btn-danger  js-exclusao-item-btn"
				data:codigo-insumo="${item.insumo.codigo}">Sim, excluir!</button>
	</div>
</div>
<div class="bw-tabela-insumo__vazio" th:if="${itens.empty}">
	<i class="glyphicon  glyphicon-shopping-cart"></i> 
	<span>Você ainda não adicionou nenhum insumo.</span>
</div>
</html>
