<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:sinapiPRO="http://sinapiPRO.ifrn.edu.br"
	xmlns:data="http://www.thymeleaf.org/extras/data">
	
<head>
	<title>Pesquisa de composicoes</title>
</head>

<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-xs-10">
					<h1>Pesquisa de Composições</h1>
				</div>
				
				<div class="col-xs-2">
					<div class="aw-page-header-controls">
						<a class="btn  btn-default" th:href="@{/composicoes/nova}">
							<i class="glyphicon  glyphicon-plus-sign"></i> <span class="hidden-xs  hidden-sm">Nova composicao</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container-fluid">
		<form method="GET" th:object="${composicaoFilter}" th:action="@{/composicoes}">
		
			<!-- pesquisar pelo codigo tambem -->
			<div class="row">
			
			    <div class="form-group  col-sm-3">
					<label for="baseInsumo">Base Insumos</label>
					<select id="baseInsumo" class="form-control" autofocus="autofocus" th:field="*{baseInsumo}">
	                   <option value="">Selecione Base de Insumos</option>
	                   <option th:each="baseInsumo : ${baseInsumos}" 
	                           th:value="${baseInsumo.codigo}" 
	                           th:text="${baseInsumo.nome}">SINAPI</option>
                	</select>
				</div>
				 
				<div class="form-group  col-sm-3">
					<label class="control-label" for="codigoComposicao">Código</label>
					<input type="number" class="form-control" id="codigoComposicao" th:field="*{codigoComposicao}"/>
				</div>
			 
				<div class="form-group  col-sm-3">
					<label for="ComposicaoClasse">Classe</label>
					<select id="ComposicaoClasse" class="form-control" th:field="*{composicaoClasse}">
	                    <option value="">Todas</option>
	                    <option th:each="composicaoClasse : ${composicaoClasses}" 
	                            th:value="${composicaoClasse.codigo}" th:text="${composicaoClasse.nome}">Hidraulica</option>
	                </select>
				</div>
				
				<div class="form-group  col-sm-3">
					<label for="composicaoGrupo">Grupo </label>
					<select id="composicaoGrupo" class="form-control" th:field="*{composicaoGrupo}">
	                    <option value="">Todos</option>
	                    <option th:each="composicaoGrupo : ${composicaoGrupos}" 
	                    	       th:value="${composicaoGrupo.codigo}" 
	                    	       th:text="${composicaoGrupo.nome}">Hidraulica</option>
	                </select>
				</div>
			</div>
			
			<div class="row">
				<div class="form-group  col-sm-12">
					<label class="control-label" for="descricao">Descrição</label>
					<input type="text" class="form-control" id="descricao" th:field="*{descricao}"/>
				</div>
			</div>	
			
			<button type="submit" class="btn  btn-primary">Pesquisar</button>

		</form>
		
		<div class="table-responsive  sn-tabela-simples">
			<table class="table  table-hover">
	            <thead>
	            	<tr>
	            	   <th class="table-insumos-col-codigo">
							<sinapiPRO:order page="${pagina}" field="codigoComposicao" text="Código"/>
						</th>
						<th class="table-insumos-col-unidade">Base</th>
						<th class="table-insumos-col-unidade">
							<sinapiPRO:order page="${pagina}" field="unidade" text="UN"/>
						</th>
						<th class="table-composicoes-col-classe">Classe</th>
						<th class="table-insumos-col-preco">Preço Padrão</th>
						<th class="table-insumos-col-descricao">
							<sinapiPRO:order page="${pagina}" field="descricao" text="Descrição"/>
						</th>
						<th class="table-insumos-col-acoes"></th> 
					</tr>
				</thead>
				
	            <tbody>
					<tr th:each="composicao : ${pagina.conteudo}">
						<td class="text-center" th:text="${composicao.codigoComposicao}"></td>
						<td class="text-center" th:text="${composicao.baseInsumo.nome}">SINAPI</td>
						<td class="text-center" th:text="${composicao.unidade}"></td>
						
						<td class="text-center">
						    <a class="js-tooltip" 
						       th:title="${composicao.composicaoClasse.nome}"	
						       th:text="${composicao.composicaoClasse.sigla}"
						    </a>
						 
						</td> 
						<td class="text-right"  th:text="|R$ ${{composicao.custoTotal}}|"></td>
						<td class="text-left"   th:text="${composicao.descricao}"></td>
						
	                 	<td class="text-center">
	                 	    
	                 	    <a class="btn  btn-link  btn-xs  js-tooltip" 
							   title="Preços" 
							   href="#" data-toggle="modal" data-target="#modalListaPrecos"> 
							   <i class="glyphicon glyphicon-stats"></i>
							</a>
							
		   					<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" 
		   						th:href="@{/composicoes/{codigo}(codigo=${composicao.codigo})}">
		   						<i class="glyphicon glyphicon-pencil"></i>
		   					</a>
	                 	</td>
	                </tr>
	                
	                <tr th:if="${pagina.vazia}">
	                	<td colspan="7">Nenhuma composicao encontrada</td>
	                </tr>
	             </tbody>
	         </table>
		</div>
		
		<sinapiPRO:pagination page="${pagina}"/>
	</div>
	
	<div class="modal fade" id="modalListaPrecos" tabindex="-1" role="dialog"  th:fragment="modal">
		<div class="modal-dialog  modal-sm">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span>
					</button>
					<h1 class="modal-title">Histórico Preços</h1>
				</div>
				
				<div class="modal-body">
   			
	   				<div class="alert  alert-danger  alert-dismissible  hidden  js-mensagem-erro" 
	   				     role="alert">
						<button type="button" 
						        class="close" 
						        data-dismiss="alert" >
						        <span aria-hidden="true">&times;</span>
						</button>
						<div><i class="fa  fa-exclamation-circle"></i>Erro na Pesquisa</div>
					</div>
	   			
			        <div id="containerTabelaPesquisaRapidaPrecos">  </div>
     			</div>
			</div>
		</div>
	</div>
	
	<script id="tabela-pesquisa-rapida-preco" type="text/x-handlebars-template">
	<div class="table-responsive  sn-tabela-simples" style="margin-top: 15px">
		<table class="table  table-hover">
			<thead>
				<tr>
                    <th class="col-sm-2">Base</th>
					<th class="col-sm-2">Referência</th>
					<th class="col-sm-2">Preço</th>
				</tr>
			</thead>
				
			<tbody>
				{{#if .}}
					{{#each .}}
						<tr data-nomeBase="{{nomeBase}}" data-anoMes="{{anoMes}}" data-preco="{{preco}}" class="js-preco-pesquisa-rapida">
							<td>{{nomeBase}}</td>
							<td>{{anoMes}}</td>
							<td>{{preco}}</td>
 						</tr>
					{{/each}}
				{{else}}
					<tr>
						<td colspan="2">Nenhuma Base Preço encontrada</td>
					</tr>
				{{/if}}
			</tbody>
		</table>
	</div>
	</script>
	
	
</section>
<th:block layout:fragment="javascript-extra">
	<script th:src="@{/javascripts/vendors/jquery.easy-autocomplete.min.js}"></script>
	<script th:src="@{/javascripts/vendors/handlebars.min.js}"></script>
	<script th:src="@{/javascripts/preco/preco.pesquisa-rapida.js}"></script>
</th:block>

</body>
</html>
