<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Conta</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${planoContas.novo}">Nova Conta</h1><h1 th:unless="${planoContas.novo}" th:text="|Edição: ${planoContas.numero} - ${planoContas.descricao}|">Conta</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/planoContas}"><i class="glyphicon glyphicon-arrow-left"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${planoContas}" th:action="${planoContas.novo} ? @{/planoContas/novo} : @{/planoContas/{c}(c=${planoContas.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-2 sn-required"><label class="control-label">Número</label><input type="text" class="form-control" th:field="*{numero}"/></div>
		<div class="form-group col-sm-6 sn-required"><label class="control-label">Descrição</label><input type="text" class="form-control" th:field="*{descricao}"/></div>
		<div class="form-group col-sm-2 sn-required">
			<label class="control-label">Tipo</label>
			<select class="form-control" th:field="*{tipo}">
				<option value="">Selecione...</option>
				<option value="RECEITA">Receita</option><option value="DESPESA">Despesa</option>
				<option value="ATIVO">Ativo</option><option value="PASSIVO">Passivo</option>
			</select>
		</div>
		<div class="form-group col-sm-1"><label class="control-label">Nível</label><input type="number" class="form-control" th:field="*{nivel}" min="1" max="5"/></div>
	</div>
	<div class="row">
		<div class="form-group col-sm-6">
			<label class="control-label">Conta Pai (opcional)</label>
			<select class="form-control" th:field="*{pai}">
				<option value="">Nenhuma</option>
				<option th:each="p : ${pais}" th:value="${p.codigo}" th:text="${p.numero + ' - ' + p.descricao}"></option>
			</select>
		</div>
		<div class="form-group col-sm-2"><label class="checkbox-inline" style="margin-top:30px;"><input type="checkbox" th:field="*{ativo}"/> Ativo</label></div>
	</div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form></div>
</section></body></html>
