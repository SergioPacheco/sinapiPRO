<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Índice</title></head>
<body><section layout:fragment="conteudo">
<div class="page-header"><div class="container-fluid"><div class="row">
	<div class="col-sm-10"><h1 th:if="${indice.novo}">Cadastro de Índice</h1><h1 th:unless="${indice.novo}" th:text="|Edição de ${indice.nome}|">Edição</h1></div>
	<div class="col-sm-2"><a class="btn btn-default" th:href="@{/indices}"><i class="glyphicon glyphicon-search"></i></a></div>
</div></div></div>
<div class="container-fluid">
<form method="POST" th:object="${indice}" th:action="${indice.novo} ? @{/indices/novo} : @{/indices/{c}(c=${indice.codigo})}">
	<sinapiPRO:message/><input type="hidden" th:field="*{codigo}"/>
	<div class="row">
		<div class="form-group col-sm-6 sn-required" sinapiPRO:classforerror="nome">
			<label class="control-label">Nome</label><input type="text" class="form-control" th:field="*{nome}" />
		</div>
		<div class="form-group col-sm-2 sn-required" sinapiPRO:classforerror="sigla">
			<label class="control-label">Sigla</label><input type="text" class="form-control text-uppercase" th:field="*{sigla}" />
		</div>
		<div class="form-group col-sm-3 sn-required" sinapiPRO:classforerror="tipo">
			<label class="control-label">Tipo</label>
			<select class="form-control" th:field="*{tipo}">
				<option value="">Selecione...</option>
				<option value="INCC">INCC</option>
				<option value="IPCA">IPCA</option>
				<option value="CUB">CUB</option>
				<option value="OUTRO">Outro</option>
			</select>
		</div>
	</div>
	<button class="btn btn-primary" type="submit">Salvar</button>
</form></div>
</section></body></html>
