<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
				xmlns:th="http://www.thymeleaf.org"
				xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
				layout:decorate="~{layout/LayoutPadrao}">
<head><title>Cadastro de Tributo</title></head>
<body>
<section layout:fragment="conteudo">
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-sm-10">
					<h1 th:if="${tributo.novo}">Cadastro de Tributo</h1>
					<h1 th:unless="${tributo.novo}" th:text="|Edição de ${tributo.descricao}|">Edição</h1>
				</div>
				<div class="col-sm-2">
					<div class="aw-page-header-controls">
						<a class="btn btn-default" th:href="@{/tributos}">
							<i class="glyphicon glyphicon-search"></i>
							<span class="hidden-xs hidden-sm">Pesquisa</span>
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="container-fluid">
		<form method="POST" th:object="${tributo}" class="form-vertical js-form-loading"
			th:action="${tributo.novo} ? @{/tributos/novo} : @{/tributos/{codigo}(codigo=${tributo.codigo})}">
			<sinapiPRO:message/>
			<input type="hidden" th:field="*{codigo}"/>
			<div class="row">
				<div class="form-group col-sm-6 sn-required" sinapiPRO:classforerror="descricao">
					<label for="descricao" class="control-label">Descrição</label>
					<input id="descricao" type="text" class="form-control" th:field="*{descricao}" />
				</div>
				<div class="form-group col-sm-3 js-decimal" sinapiPRO:classforerror="percentual">
					<label for="percentual" class="control-label">Percentual</label>
					<div class="input-group">
						<input id="percentual" type="text" class="form-control js-decimal" th:field="*{percentual}"/>
						<div class="input-group-addon">%</div>
					</div>
				</div>
				<div class="form-group col-sm-3">
					<label for="estado" class="control-label">Estado</label>
					<select id="estado" class="form-control" th:field="*{estado}">
						<option value="">Todos</option>
						<option th:each="estado : ${estados}" th:value="${estado.codigo}"
						        th:text="${estado.nome}">SP</option>
					</select>
				</div>
			</div>
			<button class="btn btn-primary" type="submit">Salvar</button>
		</form>
	</div>
</section>
</body>
</html>
